<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Growth Compass: a research-grounded personal development app, in English and Spanish, where employees drive their own growth and managers support it.">
<meta name="theme-color" content="#0F2347">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Growth Compass</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Palette: navy and gold (the owner's brand colours). Layout: app bar + workspaces (My growth / My team / Foundations); a stepped assessment tree grounded in SDT, achievement-goal, social-cognitive and I/O work-motivation theory feeds a 70-20-10 plan */
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --sunk:#E7ECF4; --ink:#0F1E3D; --muted:#56627A; --line:#D3DBE8;
  --in:#1F4E9C; --in-soft:#DEE7F7; --ex:#8C6A0E; --ex-soft:#F7EDD0;
  --navy:#0F2347; --navy-2:#1A3463; --on-navy:#F4F6FB; --on-navy-muted:#B9C5DD; --gold:#D4A72C; --gold-soft:#F7EDD0;
  --btn-bg:#0F2347; --btn-fg:#FFFFFF;
  --ok:#1E7A3C; --warn:#A35F00; --crit:#B3261E; --focus:#2B59C3;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1328; --surface:#111D36; --sunk:#182743; --ink:#E9EEF8; --muted:#9DABC4; --line:#26385C;
  --in:#86AAEB; --in-soft:#1B2E55; --ex:#E6BE52; --ex-soft:#3A2F12;
  --navy:#081127; --navy-2:#13234A; --on-navy:#F4F6FB; --on-navy-muted:#A8B6D2; --gold:#E6BE52; --gold-soft:#3A2F12;
  --btn-bg:#E6BE52; --btn-fg:#0A1328;
  --ok:#5BC77E; --warn:#F0A845; --crit:#F2827A; --focus:#9DB8FF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1328; --surface:#111D36; --sunk:#182743; --ink:#E9EEF8; --muted:#9DABC4; --line:#26385C;
  --in:#86AAEB; --in-soft:#1B2E55; --ex:#E6BE52; --ex-soft:#3A2F12;
  --navy:#081127; --navy-2:#13234A; --on-navy:#F4F6FB; --on-navy-muted:#A8B6D2; --gold:#E6BE52; --gold-soft:#3A2F12;
  --btn-bg:#E6BE52; --btn-fg:#0A1328;
  --ok:#5BC77E; --warn:#F0A845; --crit:#F2827A; --focus:#9DB8FF; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body)}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:1.6rem} h2{font-size:1.3rem} h3{font-size:1.05rem}
p{margin:0}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.bar .wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:1.15rem}
.brand svg{flex:none}
.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:10px;margin-left:auto;flex-wrap:wrap}
.tab{border:0;background:transparent;padding:6px 12px;border-radius:7px;cursor:pointer;font-weight:600;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .12)}
main.wrap{padding-block:24px 64px;display:grid;gap:20px}
.notice{border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:10px 14px;font-size:.92rem;color:var(--muted)}
.notice b{color:var(--ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px}
.eyebrow{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:8px;cursor:pointer;font-weight:700}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.sm{padding:5px 10px;font-size:.88rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.stack{display:grid;gap:12px}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:.8rem;font-weight:700;white-space:nowrap}
.chip.in{background:var(--in-soft);color:var(--in)} .chip.ex{background:var(--ex-soft);color:var(--ex)}
.chip.neutral{background:var(--sunk);color:var(--muted)}
.chip.ok{background:var(--sunk);color:var(--ok)} .chip.warn{background:var(--sunk);color:var(--warn)} .chip.crit{background:var(--sunk);color:var(--crit)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.dot.in{background:var(--in)} .dot.ex{background:var(--ex)}
.src{font-family:var(--f-mono);font-size:.7rem;padding:1px 6px;border-radius:4px;border:1px solid var(--line);color:var(--muted);white-space:nowrap;vertical-align:1px}

/* Intro */
.intro{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;align-items:center}
@media (max-width:760px){.intro{grid-template-columns:minmax(0,1fr)}}
.intro h1{font-size:clamp(1.8rem,4vw,2.5rem)}
.intro p{max-width:60ch}
.tree{display:grid;gap:6px;font-size:.9rem}
.tree .node{display:flex;gap:10px;align-items:flex-start;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.tree .n{font-family:var(--f-mono);color:var(--muted);flex:none;width:1.4em}

/* Assessment */
.steps{display:flex;gap:6px;flex-wrap:wrap}
.step{flex:1 1 70px;min-width:0;font-size:.74rem;color:var(--muted)}
.step i{display:block;height:4px;border-radius:2px;background:var(--line);margin-bottom:6px}
.step.done i{background:var(--ink)} .step.cur i{background:var(--in)}
.step.cur{color:var(--ink);font-weight:700}
.q{display:grid;gap:10px;padding-block:14px;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0}
.scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.scale label,.opt{position:relative;cursor:pointer}
.scale input,.opt input{position:absolute;opacity:0;pointer-events:none}
.scale span{display:block;text-align:center;padding:8px 2px;border:1px solid var(--line);border-radius:8px;font-family:var(--f-mono);font-size:.95rem}
.scale input:checked+span{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.scale input:focus-visible+span,.opt input:focus-visible+span{outline:2px solid var(--focus);outline-offset:2px}
.scale-legend{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:8px}
.opt span{display:block;padding:12px 14px;border:1px solid var(--line);border-radius:10px;height:100%}
.opt span small{display:block;color:var(--muted);font-size:.85rem}
.opt input:checked+span{border-color:var(--in);background:var(--in-soft);box-shadow:inset 0 0 0 1px var(--in)}
.field{display:grid;gap:6px}
.field label{font-weight:600}
input[type=text],textarea,select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea{min-height:70px;resize:vertical}
.nav{display:flex;justify-content:space-between;gap:12px;padding-top:16px;border-top:1px solid var(--line);margin-top:8px}
.branch{border-left:3px solid var(--in);padding-left:14px;display:grid;gap:10px}

/* Profile */
.balance{display:grid;gap:6px}
.balance .track{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--sunk)}
.bars{display:grid;gap:7px}
.barrow{display:grid;grid-template-columns:minmax(0,8.5em) minmax(0,1fr) 2.6em;gap:10px;align-items:center;font-size:.9rem}
.barrow .t{height:10px;background:var(--sunk);border-radius:5px;overflow:hidden}
.barrow .t b{display:block;height:100%;border-radius:5px}
.barrow.top span:first-child{font-weight:700}
.continuum{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;align-items:end}
.continuum .col{display:grid;gap:4px;justify-items:center;text-align:center;font-size:.72rem;color:var(--muted);min-width:0}
.continuum .col .bx{width:100%;height:64px;background:var(--sunk);border-radius:6px;display:flex;align-items:flex-end;overflow:hidden}
.continuum .col .bx b{display:block;width:100%;border-radius:6px 6px 0 0}
.continuum-axis{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted);border-top:1px solid var(--line);padding-top:4px}
.needs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.need{border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:4px;min-width:0}
.need .v{font-family:var(--f-display);font-size:1.3rem;font-weight:700;font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:.92rem}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.sep{border-top:1px solid var(--line);padding-top:14px}

/* Plan */
.goal{border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px;background:var(--surface)}
.goal-h{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
.goal-h>div{min-width:0}
.measure{font-size:.9rem;border:1px dashed var(--line);border-radius:8px;padding:6px 10px}
.prog{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.prog b{display:block;height:100%;background:var(--ink)}
.acts{display:grid;gap:4px}
.act{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:10px;align-items:start;padding:6px 0;border-top:1px dashed var(--line)}
.act input{margin-top:4px;width:18px;height:18px}
.act.done .txt{text-decoration:line-through;color:var(--muted)}
.tag7{font-family:var(--f-mono);font-size:.72rem;padding:1px 6px;border-radius:4px;background:var(--sunk);color:var(--muted);margin-top:3px;white-space:nowrap}
.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:1.1rem;line-height:1;padding:2px 6px}
.support{font-size:.9rem;background:var(--sunk);border-radius:8px;padding:8px 12px}
.add{display:flex;gap:8px}
.add input{flex:1}
.kirk{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:600px){.kirk{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kirk>div{border:1px solid var(--line);border-radius:10px;padding:10px;min-width:0}
.kirk .v{font-family:var(--f-display);font-weight:700;font-size:1.2rem;font-variant-numeric:tabular-nums}

/* Team */
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
@media (max-width:980px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:700px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stat .v{font-family:var(--f-display);font-size:1.8rem;font-weight:700;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:1120px;font-size:.92rem}
th{text-align:left;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer} tr.click:hover td{background:var(--sunk)}
tr.sel td{background:var(--sunk)}
.flag{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:.85rem}
.flag::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.flag.ok{color:var(--ok)} .flag.warn{color:var(--warn)} .flag.crit{color:var(--crit)} .flag.none{color:var(--muted)}
.nd{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;font-family:var(--f-mono);font-size:.7rem;font-weight:700;color:var(--surface)}
.nd.ok{background:var(--ok)} .nd.warn{background:var(--warn)} .nd.crit{background:var(--crit)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:.88rem}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.person{display:flex;align-items:center;gap:10px;min-width:0}
.person img{width:28px;height:28px;border-radius:50%;flex:none}
.guide{margin:0;padding-left:1.2em;display:grid;gap:6px;font-size:.92rem}
.empty{text-align:center;padding:32px 16px;display:grid;gap:10px;justify-items:center}
.empty p{max-width:52ch}
.checkin{border-top:1px solid var(--line);padding-top:10px;display:grid;gap:4px;font-size:.92rem}
.tip{font-size:.88rem;color:var(--warn)}

/* Foundations */
.books{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px}
.book{display:grid;gap:10px;align-content:start}
.book h3{font-size:1.1rem}
.book ul{margin:0;padding-left:1.1em;display:grid;gap:4px;font-size:.92rem}
.spine{width:44px;height:6px;border-radius:3px}

.demo-tog{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px 5px 6px;cursor:pointer;font-weight:600;font-size:.88rem;color:var(--muted)}
.demo-tog .sw{width:30px;height:18px;border-radius:9px;background:var(--line);position:relative;transition:background .15s}
.demo-tog .sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--surface);transition:transform .15s}
.demo-tog[aria-pressed="true"]{color:var(--ink);border-color:var(--ex)}
.demo-tog[aria-pressed="true"] .sw{background:var(--ex)}
.demo-tog[aria-pressed="true"] .sw::after{transform:translateX(12px)}
@media (prefers-reduced-motion:reduce){.demo-tog .sw,.demo-tog .sw::after{transition:none}}
.demo-note{border-color:var(--ex);background:var(--ex-soft);color:var(--ink)}
.personas{display:flex;gap:6px;flex-wrap:wrap}
.personas button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:.88rem}
.personas button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.personas button[aria-pressed="true"] .muted{color:inherit;opacity:.75}
.patterns{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:20px}
.move{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;padding:8px 0;border-top:1px dashed var(--line)}
.move input{margin-top:4px;width:18px;height:18px}
.move.done .txt{text-decoration:line-through;color:var(--muted)}
input[type=date]{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-width:0}
.skill{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:10px}
.skill.mastered{border-color:var(--ok)}
.stepper{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.stepper span{font-size:.74rem;text-align:center;padding:5px 2px;border-radius:6px;background:var(--sunk);color:var(--muted);min-width:0;overflow-wrap:anywhere}
.stepper span.on{background:var(--ink);color:var(--surface);font-weight:700}
.stepper span.past{background:var(--in-soft);color:var(--in)}
.skill.mastered .stepper span.on{background:var(--ok)}
.req{font-size:.88rem;border-left:3px solid var(--line);padding-left:10px;display:grid;gap:4px}
.req.open{border-left-color:var(--warn)}
.sugg{display:flex;gap:6px;flex-wrap:wrap}
.sugg button{border:1px dashed var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:.86rem;text-align:left}
.sugg button:hover{border-style:solid;border-color:var(--in)}
details summary{cursor:pointer;font-weight:600;font-size:.92rem}
/* ---- Brand: navy and gold ---- */
.bar{background:var(--navy);border-bottom:3px solid var(--gold);color:var(--on-navy)}
body::before{background:var(--navy)}
.brand{color:var(--on-navy);letter-spacing:.01em}
.tabs{background:var(--navy-2)}
.tab{color:var(--on-navy-muted)}
.tab:hover{color:var(--on-navy)}
.tab[aria-selected="true"]{background:var(--gold);color:#0F1E3D;box-shadow:none}
.demo-tog{background:transparent;border-color:rgb(255 255 255 / .25);color:var(--on-navy-muted)}
.demo-tog .sw{background:rgb(255 255 255 / .25)}
.demo-tog .sw::after{background:#FFFFFF}
.demo-tog[aria-pressed="true"]{color:var(--on-navy);border-color:var(--gold)}
.demo-tog[aria-pressed="true"] .sw{background:var(--gold)}
.bar :focus-visible{outline-color:var(--gold)}
.btn{background:var(--btn-bg);border-color:var(--btn-bg);color:var(--btn-fg)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--gold)}
.eyebrow{color:var(--ex)}
h1,h2{color:var(--ink)}
.prog{height:8px}
.prog b{background:linear-gradient(90deg,var(--gold),var(--ex))}
.stat .v{color:var(--in)}
.stat{border-top:3px solid var(--gold)}
.kirk .v{color:var(--in)}
.stepper span.on{background:var(--navy-2);color:var(--on-navy)}
.scale input:checked+span{background:var(--btn-bg);color:var(--btn-fg);border-color:var(--btn-bg)}
.opt input:checked+span{border-color:var(--gold);background:var(--gold-soft);box-shadow:inset 0 0 0 1px var(--gold)}
.filters button[aria-pressed="true"],.personas button[aria-pressed="true"]{background:var(--btn-bg);color:var(--btn-fg);border-color:var(--btn-bg)}
.step.cur i{background:var(--gold)} .step.done i{background:var(--in)}
.branch{border-left-color:var(--gold)}
.demo-note{border-color:var(--gold);background:var(--gold-soft)}
.sugg button:hover{border-color:var(--gold)}
.move input,.act input{accent-color:var(--in)}
/* Hero panels: navy with gold */
.intro,.own{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.intro h1,.own h2{color:var(--on-navy)}
.intro .eyebrow,.own .eyebrow{color:var(--gold)}
.intro .muted,.own .muted{color:var(--on-navy-muted)}
.intro .btn{background:var(--gold);border-color:var(--gold);color:#0F1E3D}
.intro .btn.ghost{background:transparent;color:var(--on-navy);border-color:rgb(255 255 255 / .35)}
.intro a{color:var(--gold)}
.intro .tree .node{background:var(--navy-2);border-color:rgb(255 255 255 / .12);color:var(--on-navy)}
.intro .tree .n{color:var(--gold)}
.own .kirk>div{background:var(--navy-2);border-color:rgb(255 255 255 / .12)}
.own .kirk .v{color:var(--gold)}
.own b{color:var(--gold)}
.lang{display:flex;gap:2px;background:var(--navy-2);border-radius:8px;padding:3px}
.lang button{border:0;background:transparent;color:var(--on-navy-muted);font-weight:700;font-size:.8rem;padding:4px 8px;border-radius:6px;cursor:pointer;letter-spacing:.04em}
.lang button[aria-pressed="true"]{background:var(--on-navy);color:var(--navy)}
.share-row{display:flex;gap:12px;justify-content:space-between;align-items:flex-start}

.bp-hero{background:var(--navy);border-color:var(--navy);color:var(--on-navy);display:grid;gap:10px}
.bp-hero h1{color:var(--on-navy);font-size:clamp(1.8rem,4vw,2.4rem)} .bp-hero .eyebrow{color:var(--gold)} .bp-hero>p{color:var(--on-navy-muted);max-width:68ch}
.bp-hero .bp-meta{min-width:0;font-size:.9rem} .bp-hero .bp-meta td{border-color:rgb(255 255 255 / .14);color:var(--on-navy);padding:6px 10px} .bp-hero .bp-meta td:first-child{color:var(--gold);white-space:nowrap}

@media (max-width:860px){.bp-toc{position:static}}
.bp-toc button{text-align:left;border:0;background:none;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:.9rem;color:var(--ink)}

<script>
// ---------- Blueprint: the full operating procedure (generated from SOP.md and SOP.es.md) ----------
/*BLUEPRINT-START*/const BLUEPRINT = {"en": {"title": "Growth Compass: Standard Operating Procedure", "meta": "<div class=\"tablewrap\"><table class=\"bp-meta\"><tbody><tr><td><b>Document<\/b><\/td><td>SOP: Using Growth Compass for personal and career development<\/td><\/tr><tr><td><b>Version<\/b><\/td><td>1.1<\/td><\/tr><tr><td><b>Effective date<\/b><\/td><td>20 October 2026<\/td><\/tr><tr><td><b>Applies to<\/b><\/td><td>Front-line managers and their direct reports (technical and non-technical roles)<\/td><\/tr><tr><td><b>Review cycle<\/b><\/td><td>Every 6 months, or when the app changes<\/td><\/tr><\/tbody><\/table><\/div>", "sections": [{"id": "bp-1", "title": "1. Purpose", "html": "<p>This SOP explains how employees and front-line managers use Growth Compass to keep personal development front and centre. It aims to:<\/p><ul><li>Find out what actually motivates each employee, covering both intrinsic and extrinsic rewards, so development plans match what people want and need.<\/li><li>Find out which basic needs at work (autonomy, competence, relatedness) are not being met, <b>and what each gap is related to<\/b>, so managers can fix causes, not symptoms.<\/li><li>Capture <b>how each person works best, in their own words<\/b>, so managers can tap into their talents. This supports both employee satisfaction and productivity.<\/li><li>Give every employee a measurable 90-day plan, sized to the time they actually have, with an honest verdict on each goal.<\/li><li>Keep the employee in control of their own development, including skills and certifications. The manager is a <b>supporting layer<\/b>: they respond to requests and create conditions, but they do not dictate what comes next.<\/li><\/ul><h3>1.1 Guiding principle: personal development is personal<\/h3><ul><li>The <b>employee<\/b> owns their development and is expected to invest the most in it: the choices, the effort, and, if they wish, some of their own time.<\/li><li>The <b>manager<\/b> is a supporting layer: they guide, give honest feedback, open doors (time, tasks, funding, mentors) and remove barriers. They do not decide the employee's direction or pace.<\/li><li><b>Skills are portable.<\/b> What people learn and master stays with them, whether their next step is inside the company or at another one. Both are treated as legitimate career moves.<\/li><li><b>A job is a way to earn and a way to learn.<\/b> Employees are encouraged to name what they want their job to teach them, and to keep a record of skills and lessons they can use anywhere. How strongly this lands depends on each person's motivation, and the app tailors its message accordingly.<\/li><\/ul>"}, {"id": "bp-2", "title": "2. Scope", "html": "<p><b>In scope:<\/b> individual development planning, monthly check-ins, 1:1 coaching preparation and team-level development planning.<\/p><p><b>Out of scope:<\/b> Growth Compass must <b>not<\/b> be used for hiring, pay decisions, performance ratings, promotion decisions or discipline. See section 7.<\/p>"}, {"id": "bp-3", "title": "3. Roles and responsibilities", "html": "<div class=\"tablewrap\"><table><thead><tr><th>Role<\/th><th>Responsibilities<\/th><\/tr><\/thead><tbody><tr><td><b>Programme owner<\/b> (HR, L&amp;D or operations lead)<\/td><td>Sets up and shares the app, briefs managers, explains purpose and privacy to employees, and reviews this SOP.<\/td><\/tr><tr><td><b>Employee<\/b><\/td><td>Completes the assessment honestly, agrees the plan with their manager, works the plan, does a monthly check-in and retakes the assessment every 90 days.<\/td><\/tr><tr><td><b>Front-line manager<\/b><\/td><td>Builds their team view, reviews it weekly, uses the coaching playbook and development moves in 1:1s, responds to status flags and reviews plans every 90 days.<\/td><\/tr><tr><td><b>HR / People team<\/b><\/td><td>Supports escalations, especially fairness and pay-equity concerns, disengagement and well-being.<\/td><\/tr><\/tbody><\/table><\/div>"}, {"id": "bp-4", "title": "4. Key terms", "html": "<div class=\"tablewrap\"><table><thead><tr><th>Term<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td><b>Motivation quality<\/b><\/td><td>Where the person's reasons for working sit on the self-determination continuum. <b>Autonomous<\/b>: they value or enjoy the work. <b>Controlled<\/b>: they work mainly for rewards or from pressure. <b>Mixed<\/b>: a blend of both. <b>Disengaged<\/b>: they see little reason to put in effort.<\/td><\/tr><tr><td><b>Needs (A·C·R)<\/b><\/td><td><b>A<\/b>utonomy (having a say), <b>C<\/b>ompetence (feeling capable) and <b>R<\/b>elatedness (feeling connected), each scored 1 to 5. A score of 2.5 or below counts as low. When a need is low, the employee picks what it is <b>related to<\/b>.<\/td><\/tr><tr><td><b>How you work best<\/b><\/td><td>Self-identified work style: alone, with a partner, in a group, or depending on the task. Also covers team identity, productive conditions, peak time, and talents in the person's own words.<\/td><\/tr><tr><td><b>Rewards (intrinsic / extrinsic)<\/b><\/td><td>Ten rewards rated by importance. Intrinsic: mastery, autonomy, purpose, learning, belonging. Extrinsic: pay, promotion, recognition, stability, flexibility.<\/td><\/tr><tr><td><b>70-20-10<\/b><\/td><td>How plan actions are organised: practice on the job (70), learning from people (20) and formal learning (10).<\/td><\/tr><tr><td><b>Development moves<\/b><\/td><td>Concrete actions generated for the manager to take for each direct report.<\/td><\/tr><tr><td><b>Team patterns<\/b><\/td><td>What's common across the team, with suggested team-level moves.<\/td><\/tr><tr><td><b>Status flag<\/b><\/td><td>An automatic signal in the team table telling the manager who needs attention first (see 5.5).<\/td><\/tr><tr><td><b>Talent<\/b><\/td><td>Something the person <b>already<\/b> does well, repeatedly, that others notice and rely on, <b>backed by evidence<\/b> (who said so, or what results show it). Without evidence it is labelled <b>Self-reported<\/b>.<\/td><\/tr><tr><td><b>Goal<\/b><\/td><td>Something the person <b>can't do yet<\/b>, or not well enough, and has to work for. It has a measure (\"Success looks like\") and a due date.<\/td><\/tr><tr><td><b>Goal verdict<\/b><\/td><td>An honest label on every goal: <b>Realistic<\/b>, <b>Stretch<\/b>, <b>Unlikely in 90 days<\/b>, <b>Not fully in your control<\/b> (it depends on other people, such as pay, promotion, recognition or flexibility) or <b>Parked for later<\/b>.<\/td><\/tr><tr><td><b>Reality check<\/b><\/td><td>Compares open plan actions with the time the employee said they have (about 2 hours per action). Goals that don't fit are <b>parked<\/b>: kept visible but not counted.<\/td><\/tr><tr><td><b>Skills passport<\/b> (skills and certifications tracker)<\/td><td>The employee's own list of skills and certifications. Suggestions are tailored to technical or non-technical roles, and the employee moves each item through its stages. Skills: Planned → Learning → Practising → <b>Mastered<\/b> (3 independent practices with good feedback). Certifications: Planned → Studying → Exam booked → <b>Certified<\/b>. Mastery needs evidence. It belongs to the employee, and <b>Copy my passport<\/b> exports it for a CV or profile.<\/td><\/tr><tr><td><b>Support request<\/b><\/td><td>A request from the employee to their manager for time, a real task to practise on, feedback, funding, a mentor, or sign-off of mastery. The manager replies: <i>I'll arrange it<\/i>, <i>Let's discuss in our 1:1<\/i>, <i>Not possible right now<\/i> or <i>Done<\/i>.<\/td><\/tr><\/tbody><\/table><\/div>"}, {"id": "bp-5", "title": "5. Procedure", "html": "<h3>5.1 Setup (programme owner, once)<\/h3><ol><li>Open the app and read the <b>Blueprint<\/b> (this procedure), then the <b>How to use<\/b> and <b>Foundations<\/b> tabs.<\/li><li>Share the app with all participating managers and employees with <b>Contributor<\/b> access. People with view-only access can read but cannot save.<\/li><li>Send a short announcement to employees that covers:<ul><li>The purpose: their development, in their words.<\/li><li>That results are not used for pay, ratings or discipline.<\/li><li>Who can see what (see section 7).<\/li><li>That it takes about 15 minutes.<\/li><\/ul><\/li><li>Brief managers on this SOP. Suggest they turn on <b>Sample data<\/b> and explore the sample team before their own team starts.<\/li><\/ol><h3>5.2 Employee procedure<\/h3><div class=\"tablewrap\"><table><thead><tr><th>Step<\/th><th>Action<\/th><th>When<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>Open <b>My growth<\/b> → <b>Take the assessment yourself<\/b>. Complete all 10 steps (about 15 minutes).<\/td><td>Day 0<\/td><\/tr><tr><td>2<\/td><td>Read your profile: why you work, needs met and what's behind any gaps, how you work best, rewards, beliefs.<\/td><td>Day 0<\/td><\/tr><tr><td>3<\/td><td>Review your generated plan. Each goal has a <b>Success looks like<\/b> measure, actions tagged 70 / 20 / 10, and what to <b>ask of your manager<\/b>.<\/td><td>Day 0<\/td><\/tr><tr><td>3a<\/td><td>In <b>Who can see my development<\/b>, name your direct manager and, if you want, share chosen parts (profile, plan, skills passport, check-ins) with anyone else, such as a mentor, another manager or HR. Everyone else sees nothing.<\/td><td>Day 0, change any time<\/td><\/tr><tr><td>4<\/td><td>Meet your manager to agree the plan. Edit, add or remove actions so it fits.<\/td><td>By week 2<\/td><\/tr><tr><td>5<\/td><td>Work the plan and tick actions off as you complete them. Leave <b>parked<\/b> goals alone until an active goal is done.<\/td><td>Ongoing<\/td><\/tr><tr><td>5a<\/td><td>In your <b>Skills passport<\/b>, choose what to work towards next, move each item through its stages, log practice, and add evidence when it's mastered or certified.<\/td><td>Ongoing<\/td><\/tr><tr><td>5b<\/td><td>When you need help, select <b>Ask for support<\/b> on that item. Say exactly what you need: time, a task, feedback, funding, a mentor or sign-off.<\/td><td>When needed<\/td><\/tr><tr><td>6<\/td><td>Add a <b>Monthly check-in<\/b>: energy, productivity, wins, a lesson you could use in any job, where you used something new on the job, what made the difference, what you need.<\/td><td>Monthly<\/td><\/tr><tr><td>7<\/td><td><b>Retake<\/b> the assessment. You get a new plan, and your previous results are kept in your history.<\/td><td>Day 90<\/td><\/tr><\/tbody><\/table><\/div><p>The 10 assessment steps:<\/p><ol><li><b>About you<\/b>: technical or non-technical role, time in current role, job title.<\/li><li><b>Why you work<\/b>: nine reasons for putting in effort, rated by how true they are.<\/li><li><b>Your needs<\/b>: autonomy, competence and relatedness. If any is low, you choose what it is related to.<\/li><li><b>How you work best<\/b>: alone or in a group, team identity, productive conditions, peak time and your talents, in your own words.<\/li><li><b>Rewards<\/b>: rate 10 intrinsic and extrinsic rewards.<\/li><li><b>Top 3<\/b>: confirm your top three drivers.<\/li><li><b>Deep dive<\/b>: one follow-up question per top driver, tailored to technical or non-technical roles.<\/li><li><b>Beliefs<\/b>: mindset, goal focus, confidence to learn, whether effort leads to results and results to rewards, and fairness.<\/li><li><b>Direction<\/b>: move into leadership, become the go-to expert, explore another area, grow in your current role, <b>build a career that can go anywhere<\/b> (here or at another company), or \"not sure yet\". Also: what you want this job to teach you, besides pay. Your manager can see your direction.<\/li><li><b>Practical<\/b>: what gets in the way, how much work time you can give, and (optional) how much of your own time you'll invest. Your plan is sized to the total.<\/li><\/ol><h3>5.2.1 Talents vs goals: setting honest expectations<\/h3><p>Growth Compass deliberately keeps talents and goals apart, and it does not sugar-coat.<\/p><ul><li><b>A talent is not a goal.<\/b> \"I'd like to be good at leading people\" is a goal. \"The team comes to me when a customer escalates, and my lead routes those calls to me\" is a talent with evidence. If you can't say who would agree or what results show it, it's a goal, and the app labels it <b>Self-reported<\/b>.<\/li><li><b>Enjoying something is not proof of skill.<\/b> What makes you lose track of time shows where to grow. It doesn't show you're already good at it.<\/li><li><b>Time decides scope.<\/b> At 1 to 2 hours a month you have time for about 2 actions in 90 days. The app parks the goals that won't fit instead of pretending they will.<\/li><li><b>Some outcomes are not in your control.<\/b> Pay depends on the pay process and budget. Promotion depends on an opening and on other people's decisions. Recognition depends on how others respond. Flexible arrangements depend on business needs. Your plan makes you ready and builds your case. It does not guarantee the outcome.<\/li><li><b>Timelines must be credible.<\/b> With under a year in role, a promotion within 90 days or a leadership role within 6 months is marked <b>Unlikely<\/b>. A realistic timeline is 12 to 24 months.<\/li><li><b>Mastery takes repetition.<\/b> A course starts a skill. Mastery means doing it independently, repeatedly, with good feedback.<\/li><\/ul><h3>5.3 Manager procedure<\/h3><div class=\"tablewrap\"><table><thead><tr><th>Step<\/th><th>Action<\/th><th>When<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>Share the app with your team. Direct reports appear in <b>My team<\/b> automatically once they name you as their direct manager. Other people appear only if they choose to share with you, marked <b>Shared with you<\/b>, and you see only the parts they shared.<\/td><td>Once<\/td><\/tr><tr><td>2<\/td><td>Review the <b>team table<\/b> and <b>Team patterns<\/b>. Check the status column and A·C·R dots first.<\/td><td>Weekly (10 minutes)<\/td><\/tr><tr><td>3<\/td><td>Respond to any status flags using the table in 5.5.<\/td><td>Within the stated time<\/td><\/tr><tr><td>4<\/td><td>Before each 1:1, select the person and read their <b>Development moves<\/b> and <b>Coaching playbook<\/b>.<\/td><td>Before every 1:1<\/td><\/tr><tr><td>5<\/td><td>In the 1:1, use the suggested questions. Agree one or two development moves and tick them off when done. Record agreements in <b>Private coaching notes<\/b>.<\/td><td>Every 1:1<\/td><\/tr><tr><td>5a<\/td><td>Answer every <b>support request<\/b> in the person's panel. Arrange it, discuss it in the 1:1, or say <i>not possible right now<\/i> with a reason and a date. Don't edit or redirect their tracker: they own it.<\/td><td>Within 1 week<\/td><\/tr><tr><td>5b<\/td><td>Use the <b>Talents vs goals<\/b> card and the goal verdicts. Confirm or challenge self-reported talents honestly. Never promise pay or promotion you don't control.<\/td><td>Every 1:1<\/td><\/tr><tr><td>6<\/td><td>Pick one <b>team-level move<\/b> from Team patterns and run it, for example a huddle on autonomy, a team learning hour or a buddy pairing.<\/td><td>Monthly<\/td><\/tr><tr><td>7<\/td><td>Review the <b>Is it working?<\/b> panel with each person (reaction, learning, behaviour, results), then ask them to retake.<\/td><td>Day 90<\/td><\/tr><\/tbody><\/table><\/div><p><b>How to address development for each direct report.<\/b> The app gives managers three levels of support:<\/p><ol><li><b>Fix root causes:<\/b> for any low need, the playbook gives the specific cause the employee named and the matching fix. For example, low autonomy related to micromanagement → agree outcomes and check-in points, then stop checking the how.<\/li><li><b>Tap into talent:<\/b> use what colleagues come to them for and the work that makes them lose track of time. Build it into their assignments and let them teach it to others.<\/li><li><b>Set up their work the way they're productive:<\/b> use their preferred work mode (alone, partner, group), their best conditions and their peak time when scheduling important work.<\/li><\/ol><p><b>Support, don't dictate.<\/b> The employee decides what to develop next and how fast. The manager's job is to remove barriers (time, tasks, feedback, funding, mentors), give honest feedback and confirm mastery when it's real. If you think a choice is unrealistic, say so plainly and explain why. The decision stays with them.<\/p><p>On top of these, development moves cover stretch assignments, delegation, learning time, act-up opportunities, recognition, career conversations and regular informational feedback.<\/p><h3>5.4 Rhythm at a glance<\/h3><div class=\"tablewrap\"><table><thead><tr><th>When<\/th><th>What<\/th><\/tr><\/thead><tbody><tr><td>Day 0<\/td><td>Employee takes the assessment<\/td><\/tr><tr><td>By week 2<\/td><td>1:1 to agree the plan<\/td><\/tr><tr><td>Every week<\/td><td>Manager scans the team table (10 minutes)<\/td><\/tr><tr><td>Every month<\/td><td>Employee check-in + 1:1 on progress; manager runs one team-level move<\/td><\/tr><tr><td>Day 45<\/td><td>Review the Foundation goal, if the plan has one<\/td><\/tr><tr><td>Day 90<\/td><td>Review results, then retake<\/td><\/tr><\/tbody><\/table><\/div><h3>5.5 Responding to status flags<\/h3><div class=\"tablewrap\"><table><thead><tr><th>Status<\/th><th>What it means<\/th><th>Manager action<\/th><th>Timeframe<\/th><\/tr><\/thead><tbody><tr><td><b>Disengagement risk<\/b><\/td><td>Strong agreement that there's little reason to put in effort<\/td><td>Private conversation. Listen first; check workload, fit and well-being. Involve HR if needed.<\/td><td>Within 1 week<\/td><\/tr><tr><td><b>Retention risk<\/b><\/td><td>3+ years in role and a stalled plan or low energy<\/td><td>Career conversation: scope, next role, what would make them stay.<\/td><td>Within 2 weeks<\/td><\/tr><tr><td><b>Low energy at last check-in<\/b><\/td><td>Energy rated 2 or below<\/td><td>Ask what's draining them and what would help.<\/td><td>Within 1 week<\/td><\/tr><tr><td><b>Fairness concern<\/b><\/td><td>Rates fairness of rewards 2 or below<\/td><td>Explain how decisions are made. Take pay-equity questions to HR.<\/td><td>Next 1:1<\/td><\/tr><tr><td><b>Plan stalled<\/b><\/td><td>Under 20% done after 30+ days<\/td><td>Remove blockers. Shrink the plan to one action they can finish this week.<\/td><td>Next 1:1<\/td><\/tr><tr><td><b>Support ask waiting<\/b><\/td><td>The employee asked for support and hasn't had a reply<\/td><td>Reply: arrange, discuss or \"not yet\" with a reason and a date.<\/td><td>Within 1 week<\/td><\/tr><tr><td><b>Check-in overdue<\/b><\/td><td>No check-in for 35+ days<\/td><td>Do the check-in together.<\/td><td>Next 1:1<\/td><\/tr><tr><td><b>Assessment not started<\/b><\/td><td>No results yet<\/td><td>Invite them personally and explain the purpose.<\/td><td>This week<\/td><\/tr><tr><td><b>On track<\/b><\/td><td>None of the above<\/td><td>Recognise progress specifically.<\/td><td>Ongoing<\/td><\/tr><\/tbody><\/table><\/div>"}, {"id": "bp-6", "title": "6. Records", "html": "<ul><li>Each employee's full record (profile, plan, skills passport, check-ins) is stored privately for that employee.<\/li><li><b>The employee decides who sees it.<\/b> Their named direct manager sees the full record. Anyone else sees only the sections the employee shares with them. Everyone else sees nothing. The employee can change this at any time.<\/li><li>In this version, the parts an employee shares are kept in a shared record that the app shows only to the people they chose. For a company-wide rollout, back this with your HR system's access controls.<\/li><li>Managers' <b>private coaching notes<\/b> and development-move ticks are visible only to that manager.<\/li><li>Each employee's last six assessment results are kept in their history when they retake.<\/li><\/ul>"}, {"id": "bp-7", "title": "7. Privacy and appropriate use", "html": "<ol><li><b>Development only.<\/b> Results must never be used for hiring, pay, ratings, promotion or discipline decisions.<\/li><li><b>Employee control and transparency.<\/b> Employees choose who sees their development. Before they start, explain that their direct manager will see the full record once named, and that anything else is shared only by their choice. Never ask an employee to share with anyone beyond their direct manager.<\/li><li><b>Not a clinical or validated test.<\/b> The questions were written for this app, following established research frameworks. They are not reproductions of published scales and have not been psychometrically validated. Treat scores as conversation starters.<\/li><li><b>Snapshot, not a label.<\/b> People change; retake every 90 days.<\/li><li><b>Escalation.<\/b> Concerns about well-being, discrimination or pay equity go to HR, following existing company policy.<\/li><\/ol>"}, {"id": "bp-8", "title": "8. Troubleshooting", "html": "<div class=\"tablewrap\"><table><thead><tr><th>Problem<\/th><th>Fix<\/th><\/tr><\/thead><tbody><tr><td>\"View only\" banner, can't save<\/td><td>Ask the programme owner for Contributor access.<\/td><\/tr><tr><td>A direct report doesn't appear in <b>My team<\/b><\/td><td>They must finish the assessment and name you as their direct manager in <b>Who can see my development<\/b>.<\/td><\/tr><tr><td>Team table is empty<\/td><td>No one has named you as their manager or shared with you yet. Turn on <b>Sample data<\/b> to see how the view works.<\/td><\/tr><tr><td>A person shows <b>Limited view<\/b><\/td><td>They shared only some sections with you. That's their choice.<\/td><\/tr><tr><td>Switch language<\/td><td>Use <b>EN / ES<\/b> in the top bar. The app remembers your choice on that device.<\/td><\/tr><tr><td>Results look wrong<\/td><td>Retake the assessment. Answers should describe how things are now.<\/td><\/tr><tr><td>\"The assessment has been updated\" notice<\/td><td>Retake to get a profile based on the current version.<\/td><\/tr><tr><td>A goal says <b>Parked for later<\/b><\/td><td>There isn't time for it alongside the active goals. Finish one first, or agree more development time and set it to <i>In progress<\/i>.<\/td><\/tr><tr><td>A talent says <b>Self-reported<\/b><\/td><td>Add evidence in the assessment (retake), or ask your manager or a colleague whether they'd agree.<\/td><\/tr><tr><td>\"Log 3 independent practices first\" when marking a skill mastered<\/td><td>Use <b>+1 practice<\/b> each time you do it without help, or ask your manager for sign-off.<\/td><\/tr><\/tbody><\/table><\/div>"}, {"id": "bp-9", "title": "9. Research foundations", "html": "<p>The app's logic draws on the frameworks in these five books (see the <b>Foundations<\/b> tab for where each one appears):<\/p><ul><li>Ryan, R. M., &amp; Deci, E. L. <i>Self-Determination Theory: Basic Psychological Needs in Motivation, Development, and Wellness.<\/i><\/li><li>Elliot, A. J., Dweck, C. S., &amp; Yeager, D. S. (Eds.). <i>Handbook of Competence and Motivation: Theory and Application<\/i> (2nd ed.).<\/li><li>Ormrod, J. E. <i>Human Learning<\/i> (8th ed.).<\/li><li>Howes, S. S., &amp; Muchinsky, P. M. <i>Psychology Applied to Work<\/i> (13th ed.).<\/li><li>Cascio, W. F., &amp; Aguinis, H. <i>Applied Psychology in Talent Management<\/i> (9th ed.).<\/li><\/ul>"}, {"id": "bp-10", "title": "10. Revision history", "html": "<div class=\"tablewrap\"><table><thead><tr><th>Version<\/th><th>Date<\/th><th>Change<\/th><\/tr><\/thead><tbody><tr><td>1.0<\/td><td>20 Oct 2026<\/td><td>First release: assessment, plans, check-ins, manager view, employee-owned skills and certifications tracker, support requests, talents vs goals reality check<\/td><\/tr><tr><td>1.1<\/td><td>20 Oct 2026<\/td><td>Employee-controlled sharing, English and Spanish, this procedure available inside the app as the <b>Blueprint<\/b> tab<\/td><\/tr><\/tbody><\/table><\/div>"}]}, "es": {"title": "Growth Compass: Procedimiento Operativo Estándar", "meta": "<div class=\"tablewrap\"><table class=\"bp-meta\"><tbody><tr><td><b>Documento<\/b><\/td><td>POE: Uso de Growth Compass para el desarrollo personal y de carrera<\/td><\/tr><tr><td><b>Versión<\/b><\/td><td>1.1<\/td><\/tr><tr><td><b>Fecha de vigencia<\/b><\/td><td>20 de octubre de 2026<\/td><\/tr><tr><td><b>Aplica a<\/b><\/td><td>Líderes de primera línea y sus reportes directos (puestos técnicos y no técnicos)<\/td><\/tr><tr><td><b>Revisión<\/b><\/td><td>Cada 6 meses, o cuando cambie la app<\/td><\/tr><\/tbody><\/table><\/div>", "sections": [{"id": "bp-1", "title": "1. Propósito", "html": "<p>Este procedimiento explica cómo los colaboradores y los líderes de primera línea usan Growth Compass para mantener el desarrollo personal en primer plano. Busca:<\/p><ul><li>Descubrir qué motiva realmente a cada colaborador, tanto recompensas intrínsecas como extrínsecas, para que los planes de desarrollo respondan a lo que la persona quiere y necesita.<\/li><li>Identificar qué necesidades básicas en el trabajo (autonomía, competencia, relación) no se están cubriendo <b>y con qué se relaciona cada brecha<\/b>, para que los líderes atiendan causas y no síntomas.<\/li><li>Registrar <b>cómo trabaja mejor cada persona, en sus propias palabras<\/b>, para que los líderes puedan aprovechar sus talentos. Esto favorece tanto la satisfacción como la productividad.<\/li><li>Dar a cada colaborador un plan medible de 90 días, ajustado al tiempo que realmente tiene, con un veredicto honesto sobre cada meta.<\/li><li>Mantener al colaborador al mando de su propio desarrollo, incluidas sus habilidades y certificaciones. El líder es una <b>capa de apoyo<\/b>: responde solicitudes y crea condiciones, pero no dicta lo que sigue.<\/li><\/ul><h3>1.1 Principio rector: el desarrollo personal es personal<\/h3><ul><li>El <b>colaborador<\/b> es dueño de su desarrollo y se espera que sea quien más invierta en él: las decisiones, el esfuerzo y, si así lo desea, parte de su propio tiempo.<\/li><li>El <b>líder<\/b> es una capa de apoyo: guía, da retroalimentación honesta, abre puertas (tiempo, tareas, financiamiento, mentores) y quita obstáculos. No decide la dirección ni el ritmo del colaborador.<\/li><li><b>Las habilidades son transferibles.<\/b> Lo que la persona aprende y domina se queda con ella, sea que su siguiente paso esté dentro de la empresa o en otra. Ambos se consideran movimientos de carrera legítimos.<\/li><li><b>Un trabajo es una forma de ganar y una forma de aprender.<\/b> Se anima a cada colaborador a nombrar qué quiere que le enseñe su trabajo y a llevar un registro de habilidades y lecciones que pueda usar en cualquier lugar. El impacto de este mensaje depende de la motivación de cada persona, y la app adapta su mensaje en consecuencia.<\/li><\/ul>"}, {"id": "bp-2", "title": "2. Alcance", "html": "<p><b>Incluye:<\/b> planificación del desarrollo individual, seguimientos mensuales, preparación de reuniones 1:1 y planificación del desarrollo a nivel de equipo.<\/p><p><b>No incluye:<\/b> Growth Compass <b>no<\/b> debe usarse para contratación, decisiones salariales, calificaciones de desempeño, decisiones de ascenso ni medidas disciplinarias. Consulta la sección 7.<\/p>"}, {"id": "bp-3", "title": "3. Roles y responsabilidades", "html": "<div class=\"tablewrap\"><table><thead><tr><th>Rol<\/th><th>Responsabilidades<\/th><\/tr><\/thead><tbody><tr><td><b>Responsable del programa<\/b> (RR. HH., capacitación u operaciones)<\/td><td>Configura y comparte la app, prepara a los líderes, explica el propósito y la privacidad a los colaboradores y revisa este procedimiento.<\/td><\/tr><tr><td><b>Colaborador<\/b><\/td><td>Completa la evaluación con honestidad, acuerda el plan con su líder, trabaja el plan, hace un seguimiento mensual y repite la evaluación cada 90 días.<\/td><\/tr><tr><td><b>Líder de primera línea<\/b><\/td><td>Revisa su vista de equipo cada semana, usa la guía de acompañamiento y las acciones de desarrollo en las reuniones 1:1, responde a las alertas de estado y revisa los planes cada 90 días.<\/td><\/tr><tr><td><b>RR. HH. / Personas<\/b><\/td><td>Apoya en los escalamientos, en especial las preocupaciones de equidad y equidad salarial, la desconexión y el bienestar.<\/td><\/tr><\/tbody><\/table><\/div>"}, {"id": "bp-4", "title": "4. Términos clave", "html": "<div class=\"tablewrap\"><table><thead><tr><th>Término<\/th><th>Significado<\/th><\/tr><\/thead><tbody><tr><td><b>Calidad de la motivación<\/b><\/td><td>Dónde se ubican las razones de la persona para trabajar en el continuo de la autodeterminación. <b>Autónoma<\/b>: valora o disfruta el trabajo. <b>Controlada<\/b>: trabaja sobre todo por recompensas o por presión. <b>Mixta<\/b>: una combinación de ambas. <b>Desconectada<\/b>: ve pocas razones para esforzarse.<\/td><\/tr><tr><td><b>Necesidades (A·C·R)<\/b><\/td><td><b>A<\/b>utonomía (tener voz), <b>C<\/b>ompetencia (sentirse capaz) y <b>R<\/b>elación (sentirse conectado), cada una con un puntaje de 1 a 5. Un puntaje de 2.5 o menos se considera bajo. Cuando una necesidad sale baja, el colaborador elige <b>con qué se relaciona<\/b>.<\/td><\/tr><tr><td><b>Cómo trabajas mejor<\/b><\/td><td>Estilo de trabajo autoidentificado: por su cuenta, con un compañero, en grupo o según la tarea. Incluye también identidad de equipo, condiciones productivas, momento de mayor enfoque y talentos en sus propias palabras.<\/td><\/tr><tr><td><b>Recompensas (intrínsecas / extrínsecas)<\/b><\/td><td>Diez recompensas calificadas por importancia. Intrínsecas: maestría, autonomía, propósito, aprendizaje, pertenencia. Extrínsecas: salario, ascenso, reconocimiento, estabilidad, flexibilidad.<\/td><\/tr><tr><td><b>70-20-10<\/b><\/td><td>Cómo se organizan las acciones del plan: práctica en el trabajo (70), aprendizaje con otras personas (20) y aprendizaje formal (10).<\/td><\/tr><tr><td><b>Acciones de desarrollo<\/b><\/td><td>Acciones concretas que la app genera para que el líder las realice con cada reporte directo.<\/td><\/tr><tr><td><b>Patrones del equipo<\/b><\/td><td>Lo que se repite en el equipo, con acciones sugeridas a nivel de equipo.<\/td><\/tr><tr><td><b>Alerta de estado<\/b><\/td><td>Una señal automática en la tabla del equipo que indica al líder quién requiere atención primero (ver 5.5).<\/td><\/tr><tr><td><b>Talento<\/b><\/td><td>Algo que la persona <b>ya<\/b> hace bien, de forma repetida, que otros notan y en lo que confían, <b>respaldado por evidencia<\/b> (quién lo dice o qué resultados lo demuestran). Sin evidencia se marca como <b>Autodeclarado<\/b>.<\/td><\/tr><tr><td><b>Meta<\/b><\/td><td>Algo que la persona <b>aún no puede hacer<\/b>, o no lo bastante bien, y por lo que tiene que trabajar. Tiene una medida (\"El éxito se ve así\") y una fecha de vencimiento.<\/td><\/tr><tr><td><b>Veredicto de la meta<\/b><\/td><td>Una etiqueta honesta en cada meta: <b>Realista<\/b>, <b>Expandir<\/b>, <b>Poco probable en 90 días<\/b>, <b>No depende solo de ti<\/b> (depende de otras personas, como el salario, el ascenso, el reconocimiento o la flexibilidad) o <b>En pausa<\/b>.<\/td><\/tr><tr><td><b>Prueba de realidad<\/b><\/td><td>Compara las acciones abiertas del plan con el tiempo que el colaborador dijo tener (unas 2 horas por acción). Las metas que no caben quedan <b>en pausa<\/b>: siguen visibles pero no se cuentan.<\/td><\/tr><tr><td><b>Pasaporte de habilidades<\/b><\/td><td>La lista propia del colaborador de habilidades y certificaciones. Las sugerencias se adaptan a puestos técnicos o no técnicos, y el colaborador avanza cada elemento por sus etapas. Habilidades: Planeado → Aprendiendo → Practicando → <b>Dominado<\/b> (3 prácticas independientes con buena retroalimentación). Certificaciones: Planeado → Estudiando → Examen agendado → <b>Certificado<\/b>. El dominio requiere evidencia. Le pertenece al colaborador, y <b>Copiar mi pasaporte para un CV o perfil<\/b> lo exporta.<\/td><\/tr><tr><td><b>Solicitud de apoyo<\/b><\/td><td>Un pedido del colaborador a su líder: tiempo, una tarea real para practicar, retroalimentación, financiamiento, un mentor o la validación del dominio. El líder responde: <i>Lo organizo<\/i>, <i>Hablémoslo en nuestra reunión 1:1<\/i>, <i>No es posible por ahora<\/i> o <i>Hecho<\/i>.<\/td><\/tr><\/tbody><\/table><\/div>"}, {"id": "bp-5", "title": "5. Procedimiento", "html": "<h3>5.1 Configuración (responsable del programa, una vez)<\/h3><ol><li>Abre la app y lee el <b>Plan maestro<\/b> (este procedimiento) y luego las pestañas <b>Cómo usarla<\/b> y <b>Fundamentos<\/b>.<\/li><li>Comparte la app con todos los líderes y colaboradores participantes con acceso de <b>Colaborador<\/b>. Quienes tienen acceso de solo lectura pueden leer pero no guardar.<\/li><li>Envía un aviso breve a los colaboradores que incluya:<ul><li>El propósito: su desarrollo, en sus propias palabras.<\/li><li>Que los resultados no se usan para salario, calificaciones ni medidas disciplinarias.<\/li><li>Quién puede ver qué (ver la sección 7).<\/li><li>Que toma unos 15 minutos.<\/li><\/ul><\/li><li>Prepara a los líderes con este procedimiento. Sugiéreles activar <b>Datos de ejemplo<\/b> y explorar el equipo de ejemplo antes de que empiece su propio equipo.<\/li><\/ol><h3>5.2 Procedimiento del colaborador<\/h3><div class=\"tablewrap\"><table><thead><tr><th>Paso<\/th><th>Acción<\/th><th>Cuándo<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>Abre <b>Mi desarrollo<\/b> → <b>Haz tú la evaluación<\/b>. Completa los 10 pasos (unos 15 minutos).<\/td><td>Día 0<\/td><\/tr><tr><td>2<\/td><td>Lee tu perfil: por qué trabajas, necesidades cubiertas y qué hay detrás de cada brecha, cómo trabajas mejor, recompensas, creencias.<\/td><td>Día 0<\/td><\/tr><tr><td>3<\/td><td>Revisa el plan generado. Cada meta tiene una medida <b>El éxito se ve así<\/b>, acciones marcadas 70 / 20 / 10 y qué <b>pedir a tu líder<\/b>.<\/td><td>Día 0<\/td><\/tr><tr><td>3a<\/td><td>En <b>Quién puede ver mi desarrollo<\/b>, nombra a tu líder directo y, si quieres, comparte partes elegidas (perfil, plan, pasaporte de habilidades, seguimientos) con otras personas, como un mentor, otro líder o RR. HH. Nadie más ve nada.<\/td><td>Día 0, se puede cambiar en cualquier momento<\/td><\/tr><tr><td>4<\/td><td>Reúnete con tu líder para acordar el plan. Edita, agrega o quita acciones para que encaje.<\/td><td>Para la semana 2<\/td><\/tr><tr><td>5<\/td><td>Trabaja el plan y marca las acciones a medida que las completes. No toques las metas <b>en pausa<\/b> hasta terminar una meta activa.<\/td><td>Continuo<\/td><\/tr><tr><td>5a<\/td><td>En tu <b>Pasaporte de habilidades<\/b>, elige en qué trabajar después, avanza cada elemento por sus etapas, registra tu práctica y agrega evidencia cuando esté dominado o certificado.<\/td><td>Continuo<\/td><\/tr><tr><td>5b<\/td><td>Cuando necesites ayuda, selecciona <b>Pedir apoyo<\/b> en ese elemento. Di exactamente qué necesitas: tiempo, una tarea, retroalimentación, financiamiento, un mentor o una validación.<\/td><td>Cuando lo necesites<\/td><\/tr><tr><td>6<\/td><td>Agrega un <b>Seguimiento mensual<\/b>: energía, productividad, logros, una lección que podrías usar en cualquier trabajo, dónde usaste algo nuevo en el trabajo, qué marcó la diferencia y qué necesitas.<\/td><td>Cada mes<\/td><\/tr><tr><td>7<\/td><td><b>Repite<\/b> la evaluación. Obtienes un plan nuevo y tus resultados anteriores se guardan en tu historial.<\/td><td>Día 90<\/td><\/tr><\/tbody><\/table><\/div><p>Los 10 pasos de la evaluación:<\/p><ol><li><b>Sobre ti<\/b>: puesto técnico o no técnico, antigüedad en el puesto actual, nombre del puesto.<\/li><li><b>Por qué trabajas<\/b>: nueve razones para esforzarte, calificadas según qué tan ciertas son.<\/li><li><b>Tus necesidades<\/b>: autonomía, competencia y relación. Si alguna sale baja, eliges con qué se relaciona.<\/li><li><b>Cómo trabajas mejor<\/b>: por tu cuenta o en grupo, identidad de equipo, condiciones productivas, momento de mayor enfoque y tus talentos, en tus propias palabras.<\/li><li><b>Recompensas<\/b>: califica 10 recompensas intrínsecas y extrínsecas.<\/li><li><b>Top 3<\/b>: confirma tus tres motivadores principales.<\/li><li><b>A fondo<\/b>: una pregunta de seguimiento por cada motivador principal, adaptada a puestos técnicos o no técnicos.<\/li><li><b>Creencias<\/b>: mentalidad, enfoque de metas, confianza para aprender, si el esfuerzo lleva a resultados y los resultados a recompensas, y equidad.<\/li><li><b>Dirección<\/b>: pasar al liderazgo, ser el experto de referencia, explorar otra área, crecer en tu puesto actual, <b>construir una carrera que pueda ir a cualquier parte<\/b> (aquí o en otra empresa) o \"aún no estoy seguro\". Además: qué quieres que te enseñe este trabajo, además del salario. Tu líder puede ver tu dirección.<\/li><li><b>Práctico<\/b>: qué te frena, cuánto tiempo de trabajo puedes dedicar y (opcional) cuánto de tu propio tiempo invertirás. Tu plan se ajusta al total.<\/li><\/ol><h3>5.2.1 Talentos vs. metas: expectativas honestas<\/h3><p>Growth Compass separa a propósito los talentos de las metas, y no endulza la realidad.<\/p><ul><li><b>Un talento no es una meta.<\/b> \"Me gustaría ser bueno dirigiendo personas\" es una meta. \"El equipo me busca cuando un cliente escala, y mi líder me pasa esas llamadas\" es un talento con evidencia. Si no puedes decir quién estaría de acuerdo o qué resultados lo demuestran, es una meta, y la app lo marca como <b>Autodeclarado<\/b>.<\/li><li><b>Disfrutar algo no es prueba de habilidad.<\/b> Lo que te hace perder la noción del tiempo muestra hacia dónde crecer. No demuestra que ya seas bueno en ello.<\/li><li><b>El tiempo define el alcance.<\/b> Con 1 a 2 horas al mes tienes tiempo para unas 2 acciones en 90 días. La app pone en pausa las metas que no caben en lugar de fingir que sí.<\/li><li><b>Algunos resultados no dependen de ti.<\/b> El salario depende del proceso salarial y del presupuesto. El ascenso depende de que haya una vacante y de decisiones de otras personas. El reconocimiento depende de cómo respondan los demás. Los arreglos flexibles dependen de las necesidades del negocio. Tu plan te prepara y fortalece tu caso. No garantiza el resultado.<\/li><li><b>Los plazos deben ser creíbles.<\/b> Con menos de un año en el puesto, un ascenso en 90 días o un puesto de liderazgo en 6 meses se marca como <b>Poco probable<\/b>. Un plazo realista es de 12 a 24 meses.<\/li><li><b>La maestría requiere repetición.<\/b> Un curso inicia una habilidad. Dominarla significa hacerla de forma independiente, repetida y con buena retroalimentación.<\/li><\/ul><h3>5.3 Procedimiento del líder<\/h3><div class=\"tablewrap\"><table><thead><tr><th>Paso<\/th><th>Acción<\/th><th>Cuándo<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>Comparte la app con tu equipo. Tus reportes directos aparecen en <b>Mi equipo<\/b> automáticamente cuando te nombran su líder directo. Otras personas aparecen solo si eligen compartir contigo, marcadas como <b>Compartido contigo<\/b>, y ves solo las partes que compartieron.<\/td><td>Una vez<\/td><\/tr><tr><td>2<\/td><td>Revisa la <b>tabla del equipo<\/b> y los <b>Patrones del equipo<\/b>. Mira primero la columna de estado y los puntos A·C·R.<\/td><td>Cada semana (10 minutos)<\/td><\/tr><tr><td>3<\/td><td>Responde a las alertas de estado usando la tabla de la sección 5.5.<\/td><td>En el plazo indicado<\/td><\/tr><tr><td>4<\/td><td>Antes de cada reunión 1:1, selecciona a la persona y lee sus <b>Acciones de desarrollo<\/b> y su <b>Guía de acompañamiento<\/b>.<\/td><td>Antes de cada 1:1<\/td><\/tr><tr><td>5<\/td><td>En la reunión 1:1, usa las preguntas sugeridas. Acuerden una o dos acciones de desarrollo y márcalas cuando estén hechas. Registra los acuerdos en <b>Notas privadas de acompañamiento<\/b>.<\/td><td>En cada 1:1<\/td><\/tr><tr><td>5a<\/td><td>Responde cada <b>solicitud de apoyo<\/b> en el panel de la persona. Organízala, háblala en la reunión 1:1 o di <i>no es posible por ahora<\/i> con una razón y una fecha. No edites ni redirijas su registro: le pertenece.<\/td><td>En una semana<\/td><\/tr><tr><td>5b<\/td><td>Usa la tarjeta <b>Talentos vs. metas<\/b> y los veredictos de las metas. Confirma o cuestiona con honestidad los talentos autodeclarados. Nunca prometas salario o ascensos que no controlas.<\/td><td>En cada 1:1<\/td><\/tr><tr><td>6<\/td><td>Elige una <b>acción a nivel de equipo<\/b> de los Patrones del equipo y llévala a cabo, por ejemplo una reunión sobre autonomía, una hora de aprendizaje en equipo o formar duplas.<\/td><td>Cada mes<\/td><\/tr><tr><td>7<\/td><td>Revisa el panel <b>¿Está funcionando?<\/b> con cada persona (reacción, aprendizaje, comportamiento, resultados) y luego pídele repetir la evaluación.<\/td><td>Día 90<\/td><\/tr><\/tbody><\/table><\/div><p><b>Cómo atender el desarrollo de cada reporte directo.<\/b> La app ofrece al líder tres niveles de apoyo:<\/p><ol><li><b>Atender las causas raíz:<\/b> para cada necesidad baja, la guía muestra la causa específica que nombró el colaborador y la solución correspondiente. Por ejemplo, baja autonomía relacionada con microgestión → acuerden resultados y puntos de revisión, y luego deja de revisar el cómo.<\/li><li><b>Aprovechar el talento:<\/b> usa aquello para lo que sus compañeros le buscan y el trabajo que le hace perder la noción del tiempo. Incorpóralo en sus asignaciones y deja que lo enseñe a otros.<\/li><li><b>Organizar su trabajo como es productivo:<\/b> usa su modo de trabajo preferido (solo, en pareja, en grupo), sus mejores condiciones y su momento de mayor enfoque al programar el trabajo importante.<\/li><\/ol><p><b>Apoya, no dictes.<\/b> El colaborador decide qué desarrollar después y a qué ritmo. El trabajo del líder es quitar obstáculos (tiempo, tareas, retroalimentación, financiamiento, mentores), dar retroalimentación honesta y confirmar el dominio cuando es real. Si crees que una decisión no es realista, dilo con claridad y explica por qué. La decisión sigue siendo de la persona.<\/p><p>Además, las acciones de desarrollo incluyen asignaciones retadoras, delegación, tiempo de aprendizaje, oportunidades de cubrir el puesto superior, reconocimiento, conversaciones de carrera y retroalimentación informativa regular.<\/p><h3>5.4 Ritmo de un vistazo<\/h3><div class=\"tablewrap\"><table><thead><tr><th>Cuándo<\/th><th>Qué<\/th><\/tr><\/thead><tbody><tr><td>Día 0<\/td><td>El colaborador hace la evaluación<\/td><\/tr><tr><td>Para la semana 2<\/td><td>Reunión 1:1 para acordar el plan<\/td><\/tr><tr><td>Cada semana<\/td><td>El líder revisa la tabla del equipo (10 minutos)<\/td><\/tr><tr><td>Cada mes<\/td><td>Seguimiento del colaborador + reunión 1:1 de avance; el líder realiza una acción a nivel de equipo<\/td><\/tr><tr><td>Día 45<\/td><td>Revisión de la meta Base, si el plan la tiene<\/td><\/tr><tr><td>Día 90<\/td><td>Revisar resultados y repetir la evaluación<\/td><\/tr><\/tbody><\/table><\/div><h3>5.5 Cómo responder a las alertas de estado<\/h3><div class=\"tablewrap\"><table><thead><tr><th>Estado<\/th><th>Qué significa<\/th><th>Acción del líder<\/th><th>Plazo<\/th><\/tr><\/thead><tbody><tr><td><b>Riesgo de desconexión<\/b><\/td><td>Fuerte acuerdo con que hay pocas razones para esforzarse<\/td><td>Conversación privada. Escucha primero; revisa carga, encaje y bienestar. Involucra a RR. HH. si hace falta.<\/td><td>En 1 semana<\/td><\/tr><tr><td><b>Riesgo de retención<\/b><\/td><td>3 años o más en el puesto y un plan estancado o poca energía<\/td><td>Conversación de carrera: alcance, siguiente puesto, qué haría que se quede.<\/td><td>En 2 semanas<\/td><\/tr><tr><td><b>Poca energía en el último seguimiento<\/b><\/td><td>Energía calificada en 2 o menos<\/td><td>Pregunta qué le está agotando y qué ayudaría.<\/td><td>En 1 semana<\/td><\/tr><tr><td><b>Preocupación por equidad<\/b><\/td><td>Califica la equidad de las recompensas en 2 o menos<\/td><td>Explica cómo se toman las decisiones. Lleva las dudas de equidad salarial a RR. HH.<\/td><td>Próxima 1:1<\/td><\/tr><tr><td><b>Plan estancado<\/b><\/td><td>Menos del 20 % hecho después de 30 días o más<\/td><td>Quita obstáculos. Reduce el plan a una acción que pueda terminar esta semana.<\/td><td>Próxima 1:1<\/td><\/tr><tr><td><b>Solicitud de apoyo en espera<\/b><\/td><td>El colaborador pidió apoyo y no ha recibido respuesta<\/td><td>Responde: organízalo, háblalo o \"todavía no\" con una razón y una fecha.<\/td><td>En 1 semana<\/td><\/tr><tr><td><b>Seguimiento atrasado<\/b><\/td><td>Sin seguimiento por 35 días o más<\/td><td>Hagan el seguimiento juntos.<\/td><td>Próxima 1:1<\/td><\/tr><tr><td><b>Evaluación sin empezar<\/b><\/td><td>Aún no hay resultados<\/td><td>Invítale personalmente y explica el propósito.<\/td><td>Esta semana<\/td><\/tr><tr><td><b>Al día<\/b><\/td><td>Ninguna de las anteriores<\/td><td>Reconoce el progreso de forma específica.<\/td><td>Continuo<\/td><\/tr><\/tbody><\/table><\/div>"}, {"id": "bp-6", "title": "6. Registros", "html": "<ul><li>El registro completo de cada colaborador (perfil, plan, pasaporte de habilidades, seguimientos) se guarda de forma privada para esa persona.<\/li><li><b>El colaborador decide quién lo ve.<\/b> Su líder directo nombrado ve el registro completo. Cualquier otra persona ve solo las secciones que el colaborador comparte con ella. Nadie más ve nada. El colaborador puede cambiarlo en cualquier momento.<\/li><li>En esta versión, las partes que un colaborador comparte se guardan en un registro compartido que la app muestra solo a las personas que eligió. Para una implementación en toda la empresa, respáldalo con los controles de acceso de tu sistema de RR. HH.<\/li><li>Las <b>notas privadas de acompañamiento<\/b> y las marcas de acciones de desarrollo solo las ve ese líder.<\/li><li>Al repetir la evaluación se guardan en el historial los últimos seis resultados de cada colaborador.<\/li><\/ul>"}, {"id": "bp-7", "title": "7. Privacidad y uso apropiado", "html": "<ol><li><b>Solo para desarrollo.<\/b> Los resultados nunca deben usarse para decisiones de contratación, salario, calificaciones, ascensos ni medidas disciplinarias.<\/li><li><b>Control del colaborador y transparencia.<\/b> Los colaboradores eligen quién ve su desarrollo. Antes de empezar, explica que su líder directo verá el registro completo una vez nombrado, y que todo lo demás se comparte solo por su decisión. Nunca pidas a un colaborador que comparta con alguien más allá de su líder directo.<\/li><li><b>No es una prueba clínica ni validada.<\/b> Las preguntas se escribieron para esta app siguiendo marcos de investigación reconocidos. No reproducen escalas publicadas y no han sido validadas psicométricamente. Trata los puntajes como punto de partida para conversar.<\/li><li><b>Una foto del momento, no una etiqueta.<\/b> Las personas cambian; repite la evaluación cada 90 días.<\/li><li><b>Escalamiento.<\/b> Las preocupaciones sobre bienestar, discriminación o equidad salarial se llevan a RR. HH., según la política vigente de la empresa.<\/li><\/ol>"}, {"id": "bp-8", "title": "8. Solución de problemas", "html": "<div class=\"tablewrap\"><table><thead><tr><th>Problema<\/th><th>Solución<\/th><\/tr><\/thead><tbody><tr><td>Aviso de \"Solo lectura\", no se puede guardar<\/td><td>Pide al responsable del programa acceso de Colaborador.<\/td><\/tr><tr><td>Un reporte directo no aparece en <b>Mi equipo<\/b><\/td><td>Debe terminar la evaluación y nombrarte su líder directo en <b>Quién puede ver mi desarrollo<\/b>.<\/td><\/tr><tr><td>La tabla del equipo está vacía<\/td><td>Nadie te ha nombrado como su líder ni ha compartido contigo todavía. Activa <b>Datos de ejemplo<\/b> para ver cómo funciona la vista.<\/td><\/tr><tr><td>Una persona aparece con <b>Vista limitada<\/b><\/td><td>Compartió solo algunas secciones contigo. Es su decisión.<\/td><\/tr><tr><td>Cambiar de idioma<\/td><td>Usa <b>EN / ES<\/b> en la barra superior. La app recuerda tu elección en ese dispositivo.<\/td><\/tr><tr><td>Los resultados no parecen correctos<\/td><td>Repite la evaluación. Las respuestas deben describir cómo son las cosas ahora.<\/td><\/tr><tr><td>Aviso \"La evaluación se actualizó\"<\/td><td>Repítela para obtener un perfil basado en la versión actual.<\/td><\/tr><tr><td>Una meta dice <b>En pausa<\/b><\/td><td>No hay tiempo para ella junto a las metas activas. Termina una primero, o acuerda más tiempo de desarrollo y cámbiala a <i>En curso<\/i>.<\/td><\/tr><tr><td>Un talento dice <b>Autodeclarado<\/b><\/td><td>Agrega evidencia en la evaluación (repítela), o pregunta a tu líder o a un compañero si estaría de acuerdo.<\/td><\/tr><tr><td>\"Registra primero 3 prácticas independientes\" al marcar una habilidad como dominada<\/td><td>Usa <b>+1 práctica<\/b> cada vez que lo hagas sin ayuda, o pide a tu líder la validación.<\/td><\/tr><\/tbody><\/table><\/div>"}, {"id": "bp-9", "title": "9. Fundamentos de investigación", "html": "<p>La lógica de la app se basa en los marcos de estos cinco libros (la pestaña <b>Fundamentos<\/b> muestra dónde aparece cada uno):<\/p><ul><li>Ryan, R. M., y Deci, E. L. <i>Self-Determination Theory: Basic Psychological Needs in Motivation, Development, and Wellness.<\/i><\/li><li>Elliot, A. J., Dweck, C. S., y Yeager, D. S. (Eds.). <i>Handbook of Competence and Motivation: Theory and Application<\/i> (2.ª ed.).<\/li><li>Ormrod, J. E. <i>Human Learning<\/i> (8.ª ed.).<\/li><li>Howes, S. S., y Muchinsky, P. M. <i>Psychology Applied to Work<\/i> (13.ª ed.).<\/li><li>Cascio, W. F., y Aguinis, H. <i>Applied Psychology in Talent Management<\/i> (9.ª ed.).<\/li><\/ul>"}, {"id": "bp-10", "title": "10. Historial de revisiones", "html": "<div class=\"tablewrap\"><table><thead><tr><th>Versión<\/th><th>Fecha<\/th><th>Cambio<\/th><\/tr><\/thead><tbody><tr><td>1.0<\/td><td>20 oct 2026<\/td><td>Primera versión: evaluación, planes, seguimientos, vista del líder, registro de habilidades y certificaciones del colaborador, solicitudes de apoyo, prueba de realidad de talentos vs. metas<\/td><\/tr><tr><td>1.1<\/td><td>20 oct 2026<\/td><td>Compartir controlado por el colaborador, inglés y español, este procedimiento disponible dentro de la app como la pestaña <b>Plan maestro<\/b><\/td><\/tr><\/tbody><\/table><\/div>"}]}};/*BLUEPRINT-END*/
</script>
