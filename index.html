<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Growth Compass: a research-grounded personal development app for front-line managers and their teams.">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Growth Compass</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: app bar + three workspaces (My growth / My team / Foundations); a stepped assessment tree grounded in SDT, achievement-goal, social-cognitive and I/O work-motivation theory feeds a 70-20-10 plan */
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --sunk:#E9EDF1; --ink:#162231; --muted:#586577; --line:#D8DFE6;
  --in:#0D7A6B; --in-soft:#D7EFEA; --ex:#A9640A; --ex-soft:#F6E7D0;
  --ok:#1E7A3C; --warn:#A35F00; --crit:#B3261E; --focus:#2B59C3;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E141B; --surface:#161F29; --sunk:#1D2834; --ink:#E5EBF1; --muted:#99A6B5; --line:#2A3644;
  --in:#45C7B3; --in-soft:#173A36; --ex:#F0A845; --ex-soft:#3E2E17;
  --ok:#5BC77E; --warn:#F0A845; --crit:#F2827A; --focus:#86A8FF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E141B; --surface:#161F29; --sunk:#1D2834; --ink:#E5EBF1; --muted:#99A6B5; --line:#2A3644;
  --in:#45C7B3; --in-soft:#173A36; --ex:#F0A845; --ex-soft:#3E2E17;
  --ok:#5BC77E; --warn:#F0A845; --crit:#F2827A; --focus:#86A8FF; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body)}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:1.6rem} h2{font-size:1.3rem} h3{font-size:1.05rem}
p{margin:0}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.bar .wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:1.15rem}
.brand svg{flex:none}
.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:10px;margin-left:auto;flex-wrap:wrap}
.tab{border:0;background:transparent;padding:6px 12px;border-radius:7px;cursor:pointer;font-weight:600;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .12)}
main.wrap{padding-block:24px 64px;display:grid;gap:20px}
.notice{border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:10px 14px;font-size:.92rem;color:var(--muted)}
.notice b{color:var(--ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px}
.eyebrow{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:8px;cursor:pointer;font-weight:700}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.sm{padding:5px 10px;font-size:.88rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.stack{display:grid;gap:12px}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:.8rem;font-weight:700;white-space:nowrap}
.chip.in{background:var(--in-soft);color:var(--in)} .chip.ex{background:var(--ex-soft);color:var(--ex)}
.chip.neutral{background:var(--sunk);color:var(--muted)}
.chip.ok{background:var(--sunk);color:var(--ok)} .chip.warn{background:var(--sunk);color:var(--warn)} .chip.crit{background:var(--sunk);color:var(--crit)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.dot.in{background:var(--in)} .dot.ex{background:var(--ex)}
.src{font-family:var(--f-mono);font-size:.7rem;padding:1px 6px;border-radius:4px;border:1px solid var(--line);color:var(--muted);white-space:nowrap;vertical-align:1px}

/* Intro */
.intro{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;align-items:center}
@media (max-width:760px){.intro{grid-template-columns:minmax(0,1fr)}}
.intro h1{font-size:clamp(1.8rem,4vw,2.5rem)}
.intro p{max-width:60ch}
.tree{display:grid;gap:6px;font-size:.9rem}
.tree .node{display:flex;gap:10px;align-items:flex-start;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.tree .n{font-family:var(--f-mono);color:var(--muted);flex:none;width:1.4em}

/* Assessment */
.steps{display:flex;gap:6px;flex-wrap:wrap}
.step{flex:1 1 70px;min-width:0;font-size:.74rem;color:var(--muted)}
.step i{display:block;height:4px;border-radius:2px;background:var(--line);margin-bottom:6px}
.step.done i{background:var(--ink)} .step.cur i{background:var(--in)}
.step.cur{color:var(--ink);font-weight:700}
.q{display:grid;gap:10px;padding-block:14px;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0}
.scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.scale label,.opt{position:relative;cursor:pointer}
.scale input,.opt input{position:absolute;opacity:0;pointer-events:none}
.scale span{display:block;text-align:center;padding:8px 2px;border:1px solid var(--line);border-radius:8px;font-family:var(--f-mono);font-size:.95rem}
.scale input:checked+span{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.scale input:focus-visible+span,.opt input:focus-visible+span{outline:2px solid var(--focus);outline-offset:2px}
.scale-legend{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:8px}
.opt span{display:block;padding:12px 14px;border:1px solid var(--line);border-radius:10px;height:100%}
.opt span small{display:block;color:var(--muted);font-size:.85rem}
.opt input:checked+span{border-color:var(--in);background:var(--in-soft);box-shadow:inset 0 0 0 1px var(--in)}
.field{display:grid;gap:6px}
.field label{font-weight:600}
input[type=text],textarea,select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea{min-height:70px;resize:vertical}
.nav{display:flex;justify-content:space-between;gap:12px;padding-top:16px;border-top:1px solid var(--line);margin-top:8px}
.branch{border-left:3px solid var(--in);padding-left:14px;display:grid;gap:10px}

/* Profile */
.balance{display:grid;gap:6px}
.balance .track{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--sunk)}
.bars{display:grid;gap:7px}
.barrow{display:grid;grid-template-columns:minmax(0,8.5em) minmax(0,1fr) 2.6em;gap:10px;align-items:center;font-size:.9rem}
.barrow .t{height:10px;background:var(--sunk);border-radius:5px;overflow:hidden}
.barrow .t b{display:block;height:100%;border-radius:5px}
.barrow.top span:first-child{font-weight:700}
.continuum{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;align-items:end}
.continuum .col{display:grid;gap:4px;justify-items:center;text-align:center;font-size:.72rem;color:var(--muted);min-width:0}
.continuum .col .bx{width:100%;height:64px;background:var(--sunk);border-radius:6px;display:flex;align-items:flex-end;overflow:hidden}
.continuum .col .bx b{display:block;width:100%;border-radius:6px 6px 0 0}
.continuum-axis{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted);border-top:1px solid var(--line);padding-top:4px}
.needs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.need{border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:4px;min-width:0}
.need .v{font-family:var(--f-display);font-size:1.3rem;font-weight:700;font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:.92rem}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.sep{border-top:1px solid var(--line);padding-top:14px}

/* Plan */
.goal{border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px;background:var(--surface)}
.goal-h{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
.goal-h>div{min-width:0}
.measure{font-size:.9rem;border:1px dashed var(--line);border-radius:8px;padding:6px 10px}
.prog{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.prog b{display:block;height:100%;background:var(--ink)}
.acts{display:grid;gap:4px}
.act{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:10px;align-items:start;padding:6px 0;border-top:1px dashed var(--line)}
.act input{margin-top:4px;width:18px;height:18px}
.act.done .txt{text-decoration:line-through;color:var(--muted)}
.tag7{font-family:var(--f-mono);font-size:.72rem;padding:1px 6px;border-radius:4px;background:var(--sunk);color:var(--muted);margin-top:3px;white-space:nowrap}
.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:1.1rem;line-height:1;padding:2px 6px}
.support{font-size:.9rem;background:var(--sunk);border-radius:8px;padding:8px 12px}
.add{display:flex;gap:8px}
.add input{flex:1}
.kirk{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:600px){.kirk{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kirk>div{border:1px solid var(--line);border-radius:10px;padding:10px;min-width:0}
.kirk .v{font-family:var(--f-display);font-weight:700;font-size:1.2rem;font-variant-numeric:tabular-nums}

/* Team */
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
@media (max-width:980px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:700px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stat .v{font-family:var(--f-display);font-size:1.8rem;font-weight:700;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:1120px;font-size:.92rem}
th{text-align:left;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer} tr.click:hover td{background:var(--sunk)}
tr.sel td{background:var(--sunk)}
.flag{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:.85rem}
.flag::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.flag.ok{color:var(--ok)} .flag.warn{color:var(--warn)} .flag.crit{color:var(--crit)} .flag.none{color:var(--muted)}
.nd{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;font-family:var(--f-mono);font-size:.7rem;font-weight:700;color:var(--surface)}
.nd.ok{background:var(--ok)} .nd.warn{background:var(--warn)} .nd.crit{background:var(--crit)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:.88rem}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.person{display:flex;align-items:center;gap:10px;min-width:0}
.person img{width:28px;height:28px;border-radius:50%;flex:none}
.guide{margin:0;padding-left:1.2em;display:grid;gap:6px;font-size:.92rem}
.empty{text-align:center;padding:32px 16px;display:grid;gap:10px;justify-items:center}
.empty p{max-width:52ch}
.checkin{border-top:1px solid var(--line);padding-top:10px;display:grid;gap:4px;font-size:.92rem}
.tip{font-size:.88rem;color:var(--warn)}

/* Foundations */
.books{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px}
.book{display:grid;gap:10px;align-content:start}
.book h3{font-size:1.1rem}
.book ul{margin:0;padding-left:1.1em;display:grid;gap:4px;font-size:.92rem}
.spine{width:44px;height:6px;border-radius:3px}

.demo-tog{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px 5px 6px;cursor:pointer;font-weight:600;font-size:.88rem;color:var(--muted)}
.demo-tog .sw{width:30px;height:18px;border-radius:9px;background:var(--line);position:relative;transition:background .15s}
.demo-tog .sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--surface);transition:transform .15s}
.demo-tog[aria-pressed="true"]{color:var(--ink);border-color:var(--ex)}
.demo-tog[aria-pressed="true"] .sw{background:var(--ex)}
.demo-tog[aria-pressed="true"] .sw::after{transform:translateX(12px)}
@media (prefers-reduced-motion:reduce){.demo-tog .sw,.demo-tog .sw::after{transition:none}}
.demo-note{border-color:var(--ex);background:var(--ex-soft);color:var(--ink)}
.personas{display:flex;gap:6px;flex-wrap:wrap}
.personas button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:.88rem}
.personas button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.personas button[aria-pressed="true"] .muted{color:inherit;opacity:.75}
.patterns{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:20px}
.move{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;padding:8px 0;border-top:1px dashed var(--line)}
.move input{margin-top:4px;width:18px;height:18px}
.move.done .txt{text-decoration:line-through;color:var(--muted)}
input[type=date]{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-width:0}
.skill{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:10px}
.skill.mastered{border-color:var(--ok)}
.stepper{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.stepper span{font-size:.74rem;text-align:center;padding:5px 2px;border-radius:6px;background:var(--sunk);color:var(--muted);min-width:0;overflow-wrap:anywhere}
.stepper span.on{background:var(--ink);color:var(--surface);font-weight:700}
.stepper span.past{background:var(--in-soft);color:var(--in)}
.skill.mastered .stepper span.on{background:var(--ok)}
.req{font-size:.88rem;border-left:3px solid var(--line);padding-left:10px;display:grid;gap:4px}
.req.open{border-left-color:var(--warn)}
.sugg{display:flex;gap:6px;flex-wrap:wrap}
.sugg button{border:1px dashed var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:.86rem;text-align:left}
.sugg button:hover{border-style:solid;border-color:var(--in)}
details summary{cursor:pointer;font-weight:600;font-size:.92rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:8px 16px;border-radius:8px;font-weight:600;z-index:20}
</style>
</head>
<body>
<header class="bar">
  <div class="wrap">
    <div class="brand">
      <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="12.5" fill="none" stroke="var(--ink)" stroke-width="1.5"/><path d="M14 4 L17 14 L14 24 L11 14 Z" fill="var(--in)"/><path d="M14 14 L17 14 L14 24 Z" fill="var(--ex)"/></svg>
      Growth Compass
    </div>
    <nav class="tabs" role="tablist" aria-label="Workspace">
      <button class="tab" role="tab" id="tab-me" data-action="view" data-v="me">My growth</button>
      <button class="tab" role="tab" id="tab-team" data-action="view" data-v="team">My team</button>
      <button class="tab" role="tab" id="tab-guide" data-action="view" data-v="guide">How to use</button>
      <button class="tab" role="tab" id="tab-science" data-action="view" data-v="science">Foundations</button>
    </nav>
    <button class="demo-tog" id="demo-tog" data-action="demo" aria-pressed="false"><span class="sw" aria-hidden="true"></span>Sample data</button>
  </div>
</header>
<main class="wrap" id="app"></main>
<div class="toast" id="toast" hidden></div>

<script>
// ---------- Sources (short tags shown next to guidance) ----------
const SRC = {
  SDT: "Ryan & Deci, Self-Determination Theory",
  HCM: "Elliot, Dweck & Yeager, Handbook of Competence and Motivation (2nd ed.)",
  HL: "Ormrod, Human Learning (8th ed.)",
  PAW: "Howes & Muchinsky, Psychology Applied to Work (13th ed.)",
  APTM: "Cascio & Aguinis, Applied Psychology in Talent Management (9th ed.)"
};
const src = k => `<span class="src" title="${SRC[k]}">${k}</span>`;

// ---------- Branch 1: who you are ----------
const TRACKS = {
  tech: {label: "Technical", hint: "Engineering, IT, maintenance, technicians, data, specialist tools or equipment"},
  non:  {label: "Non-technical", hint: "Operations, customer service, sales, admin, people and business roles"}
};
const TENURE = {
  lt1: {label: "Less than 1 year", stage: "Foundation", note: "Focus on mastering the basics and building relationships before stretching wide.", extra: "Agree with your manager on what \"fully proficient\" looks like in this role and check against it at 30, 60 and 90 days.", mgr: "Make expectations explicit, pair them with a buddy and check in more often than usual."},
  y1_3: {label: "1 to 3 years", stage: "Build", note: "You know the role. Now is the time to add depth and results you can point to.", extra: "Pick one result this quarter you can show with numbers.", mgr: "Give stretch work with specific feedback, and start talking openly about next steps."},
  y3_5: {label: "3 to 5 years", stage: "Stretch", note: "You are experienced here. Growth now comes from bigger scope, new challenges or a next role.", extra: "Agree with your manager on a scope increase or a next-role conversation within 60 days.", mgr: "Watch for plateau. Discuss the next role openly and broaden their scope."},
  y5: {label: "5+ years", stage: "Renew", note: "Deep experience is an asset. Keep it fresh and multiply it through others.", extra: "Mentor or teach one colleague something you know well this quarter.", mgr: "Use their expertise to develop others and refresh their challenge. Check they still feel stretched."}
};

// ---------- Branch 2: why you work (SDT motivation continuum) ----------
// Items written for this app, structured on SDT's regulation types; not a reproduction of a published scale.
const REGS = [
  {k:"amotivation", label:"Amotivation", w:null, desc:"No clear reason to put in effort"},
  {k:"external", label:"External", w:-2, desc:"Effort for rewards or to avoid consequences"},
  {k:"introjected", label:"Introjected", w:-1, desc:"Effort from guilt, pressure or ego"},
  {k:"identified", label:"Identified", w:1, desc:"Effort because you value the outcome"},
  {k:"intrinsic", label:"Intrinsic", w:2, desc:"Effort because the work itself is enjoyable"}
];
const WHY = [
  {k:"ext1", reg:"external", text:"To get rewards like pay, a bonus or a promotion"},
  {k:"ide1", reg:"identified", text:"Because this work is personally important to me"},
  {k:"int1", reg:"introjected", text:"Because I'd feel guilty or ashamed if I didn't"},
  {k:"intr1", reg:"intrinsic", text:"Because I enjoy the work itself"},
  {k:"amo", reg:"amotivation", text:"Honestly, I don't see much reason to put effort into this job"},
  {k:"ext2", reg:"external", text:"To avoid criticism or consequences from my manager or others"},
  {k:"ide2", reg:"identified", text:"Because the effort helps me reach goals I value"},
  {k:"int2", reg:"introjected", text:"Because I need to prove to myself and others that I'm capable"},
  {k:"intr2", reg:"intrinsic", text:"Because the work is interesting and I like the challenge"}
];
// ---------- Branch 3: basic psychological needs (SDT) ----------
// When a need scores low, a branch asks what it is related to; each source maps to a specific fix.
const NEEDS = [

// ---------- Scoring ----------
function profileOf(a){
  const why = a.why || {}, nd = a.needs || {}, b = a.beliefs || {}, r = a.ratings || {};
  const reg = Object.fromEntries(REGS.map(g => [g.k, avg(WHY.filter(w => w.reg === g.k).map(w => why[w.k]))]));
  const rai = REGS.filter(g => g.w).reduce((s, g) => s + g.w * (reg[g.k] || 0), 0);
  const quality = (reg.amotivation || 0) >= 4 ? {k:"amotivated", label:"Disengaged", cls:"crit"}
    : rai >= 3 ? {k:"autonomous", label:"Autonomous", cls:"ok"} : rai <= -1 ? {k:"controlled", label:"Controlled", cls:"warn"} : {k:"mixed", label:"Mixed", cls:"neutral"};
  const needs = Object.fromEntries(NEEDS.map(n => [n.k, nd[n.k + "_s"] && nd[n.k + "_f"] ? (nd[n.k + "_s"] + 6 - nd[n.k + "_f"]) / 2 : null]));
  const mindsetV = b.fixed && b.growth ? (b.growth + 6 - b.fixed) / 2 : null;
  const mindset = mindsetV == null ? null : mindsetV >= 3.5 ? "Growth" : mindsetV <= 2.5 ? "Fixed" : "Mixed";
  const pct = v => v ? Math.round((v - 1) / 4 * 100) : 0;
  const inPct = pct(avg(DRIVERS.filter(d => d.type === "in").map(d => r[d.key])));
  const exPct = pct(avg(DRIVERS.filter(d => d.type === "ex").map(d => r[d.key])));
  const st = a.style || {};
  const identity = avg([st.id1, st.id2]);
  return {reg, rai: Math.round(rai * 10) / 10, quality, needs, mindset, mindsetV, b, inPct, exPct, identity};
}
const needLow = v => v != null && v <= 2.5;
// Need → what it's related to → what to do about it
function needsMap(a){
  const P = profileOf(a);
  return NEEDS.map(n => { const v = P.needs[n.k]; const s = needLow(v) ? n.src[a.needSrc?.[n.k]] : null;
    return {n, v, low: needLow(v), source: s?.label || "", fix: s ? s.fix : needLow(v) ? n.mgr : ""}; });
}
function qualityText(q){
  return {
    autonomous: "Most of your effort comes from valuing or enjoying the work. That kind of motivation tends to last and supports well-being and learning.",
    mixed: "Your effort comes from a mix of valuing the work and outside pressure or rewards. Connecting tasks to goals you care about can shift the balance.",
    controlled: "Much of your effort comes from rewards, pressure or obligation. That can work short-term but is harder to sustain. Your plan focuses on finding personal value in the work.",
    amotivated: "Right now you may not see much reason to put effort in. That's important to talk about openly with your manager. The plan starts small."
  }[q.k];
}
function rewardText(p){
  if (p.inPct - p.exPct >= 15) return "Growth, meaning and ownership matter more to you than incentives right now.";
  if (p.exPct - p.inPct >= 15) return "Tangible rewards (pay, title, recognition, stability) matter most right now. Your plan makes the path to them explicit.";
  return "Both the work itself and its rewards matter to you.";
}

// ---------- Plan generation ----------
function makePlan(a){
  const t = a.track, P = profileOf(a);
  const goals = a.top.map((k, i) => {
    const d = DMAP[k]; const f = optsFor(d, t)[a.deep?.[k] ?? 0];
    return {id: uid(), driver: k, title: d.goal(f), measure: d.measure(f), due: addDays(30 * (i + 1)), status: "Not started", support: d.mgr(f),
      actions: [{id: uid(), type: "70", text: d.a70(f, t), done: false}, {id: uid(), type: "20", text: d.a20(f, t), done: false}, {id: uid(), type: "10", text: d.a10(f, t), done: false}]};
  });
  // Foundation goal: only when needs are frustrated or beliefs could block growth
  const fuel = [];
  NEEDS.forEach(n => { if (needLow(P.needs[n.k])) fuel.push(n.act); });
  if ((P.b.efficacy || 5) <= 2 && !fuel.some(x => x === NEEDS[1].act)) fuel.push(NEEDS[1].act);
  if ((P.b.efficacy || 5) <= 2) fuel.push({type:"20", text:"Watch a peer at a similar level handle something you find hard, then try it yourself the same week."});
  if (P.mindset === "Fixed") fuel.push({type:"70", text:"Keep a weekly \"mistake → lesson\" note: one thing that went wrong and what you'll try next time."});
  if (a.goalO === "pav" || a.goalO === "mav") fuel.push({type:"10", text:"Each month, compare your work with your own work last month, not with other people's."});
  fuel.splice(3);
  if (fuel.length) goals.unshift({id: uid(), driver: "fuel", title: "Build the confidence and conditions to grow", measure: "Your needs and confidence scores improve when you retake the assessment in 90 days.",
    due: addDays(45), status: "Not started", support: "Start with small wins and informational feedback. Ask about what's getting in the way before adding stretch.",
    actions: fuel.map(x => ({id: uid(), ...x, done: false}))});
  // Strengths goal: built from what the person said about their own talents and best conditions
  const st = a.style || {};
  const talent = (st.talent || "").trim(), flow = (st.flow || "").trim();
  const conds = (st.conds || []).map(k => CONDS[k]?.toLowerCase()).filter(Boolean);
  if (talent || flow){
    const acts = [];
    if (talent) acts.push({type:"70", text:`Agree with your manager on one way to use "${talent}" more in your regular work.`});
    if (flow) acts.push({type:"70", text:`Find ways to do more of the work where you lose track of time ("${flow}"), and note how it affects your output.`});
    if (conds.length) acts.push({type:"70", text:`Set up at least one block each week with your best conditions: ${conds.slice(0, 3).join(", ")}.`});
    acts.push({type:"20", text: st.mode === "alone" ? "Share one thing you're good at with a colleague in a short one-to-one walkthrough." : "Teach or support a teammate using your strength."});
    goals.push({id: uid(), driver: "talent", title: "Use your strengths more, in the way you work best", measure: "More of your week goes to work that uses your strengths, and your productivity rating rises at check-ins.",
      due: addDays(60), status: "Not started", support: `Build their strengths into their assignments.${MODES[st.mode] ? " " + MODES[st.mode].mgr : ""}`,
      actions: acts.map(x => ({id: uid(), ...x, done: false}))});
  }
  const dir = DIRS[a.direction];
  if (dir){
    const det = (a.dirDetail || "").trim(); const ten = TENURE[a.tenure];
    const acts = [{type:"70", text: dir.a70(det, t)}, {type:"20", text: dir.a20(det, t)}, {type:"10", text: dir.a10(det, t)}];

const HOURS_90 = [4.5, 12, 24];     // development hours over 90 days for each HOURS option

function realityCheck(doc){

  const open = goals.filter(g => g.status !== "Later").reduce((n, g) => n + (g.actions || []).filter(x => !x.done).length, 0);
  let used = 0; const verdicts = {};
  goals.forEach(g => {

    const left = (g.actions || []).filter(x => !x.done).length;
    let v = {level:"ok", text:"Within your control and sized for 90 days, if you do the actions."};
    if (g.driver === "mastery") v = {level:"ok", text:"Realistic progress in 90 days. Real mastery takes months of repeated practice; one course won't do it."};
    if (g.driver === "growth") v = {level:"ok", text:"Realistic to start and apply in 90 days. Certifications usually take weeks to months of study; check the official exam guide."};
    if (g.driver === "pay") v = {level:"outside", text:"Pay depends on the company's pay process and budget, not only on you. This goal builds your case. It does not guarantee a rise."};
    if (g.driver === "promotion") v = a.tenure === "lt1"

      : {level:"outside", text:"Promotion depends on an opening and on other people's decisions. This goal makes you ready. It cannot guarantee the role."};
    if (g.driver === "recognition") v = {level:"outside", text:"You control making your work visible. You don't control how others respond."};
    if (g.driver === "flex") v = {level:"outside", text:"Depends on business needs and policy. A trial is realistic. A guaranteed arrangement is not."};
    if (g.driver === "career" && a.direction === "up"){
      if (a.dirDetail === "Within 6 months" && a.tenure === "lt1") v = {level:"unlikely", text:"Going from new in role to leading others in 6 months is unlikely. A realistic timeline is 12 to 24 months."};
      else if (a.dirDetail === "Within 6 months") v = {level:"stretch", text:"Possible only with consistent effort and an opening. Plan for 12 months and treat 6 as a bonus."};
      else v = {level:"ok", text:"A realistic timeline, if you build a track record of leading small things now."};
    }
    if (left && used + left > feasible && used >= feasible) v = {level:"unlikely", text:`Won't fit. With ${HOURS[a.hours ?? 1].toLowerCase()} you have time for about ${feasible} actions in 90 days, and earlier goals use them up. Drop this goal for now or free up more time.`};
    else if (left && used + left > feasible) v = {level: v.level === "ok" ? "stretch" : v.level, text: v.text + ` Only part of this fits the time you have.`};

function talentStatus(st){

function statusFor(doc, empId){

function playbook(a){
  const P = profileOf(a), out = [], ten = TENURE[a.tenure];

  const q = {
    autonomous: "Protect what's working. Avoid micromanaging, and don't turn rewards into levers of control, which can crowd out motivation that comes from the work itself.",
    mixed: "Help them see how tasks connect to goals they value. Explain the why behind requests so the reasons become their own.",
    controlled: "Rewards and pressure drive most of their effort. Give a meaningful rationale for tasks, acknowledge their perspective and offer choices so they can come to value the work.",
    amotivated: "Talk privately and listen first. Ask what would make the work worth doing, and check workload, fit and well-being before adding goals."

  out.push(["SDT", `<b>Motivation quality: ${esc(P.quality.label)}.</b> ${esc(q)}`]);
  needsMap(a).forEach(m => { if (m.low) out.push(["SDT", `<b>${esc(m.n.label)} is low${m.source ? `, mostly related to: ${esc(m.source.toLowerCase())}` : ""}.</b> ${esc(m.fix)}`]); });
  const st = a.style || {};

  if (st.talent || st.flow) out.push(["APTM", `<b>Tap into their talent.</b> ${st.talent ? `Colleagues come to them for "${esc(st.talent)}". ` : ""}${st.flow ? `They lose track of time when "${esc(st.flow)}". ` : ""}Build more of that into their assignments, and let them teach it to others.`]);
  if (MODES[st.mode]) out.push(["SDT", `<b>Works best ${esc(MODES[st.mode].label.toLowerCase())}.</b> ${esc(MODES[st.mode].mgr)}`]);
  if ((st.conds || []).length) out.push(["PAW", `<b>Most productive with:</b> ${esc(st.conds.map(k => CONDS[k]).filter(Boolean).join(", ").toLowerCase())}${st.peak != null ? `, ${esc(PEAK[st.peak].toLowerCase())}` : ""}. Schedule their most important work in those conditions.`]);
  if (P.identity != null && P.identity <= 2.5) out.push(["SDT", "<b>Low team identity.</b> Build a shared sense of \"us\": a common team goal, team rituals, and making their contribution to the team visible."]);
  else if (P.identity != null && P.identity >= 4) out.push(["SDT", "<b>Strong team identity.</b> They are invested in the team. Use it: give them a role in team goals, onboarding or team improvements."]);
  if (P.mindset === "Fixed") out.push(["HCM", "<b>Leans to a fixed mindset.</b> Praise strategy, effort and progress rather than talent. Treat mistakes as information, not verdicts."]);
  if (a.goalO === "pav" || a.goalO === "mav") out.push(["HCM", "<b>Avoidance goals.</b> Frame feedback around personal progress, not comparison with others, and avoid public rankings."]);

  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", String(t.dataset.v === S.view)));

function renderPlan(doc, editable, extra = ""){
  const p = doc.plan; const prog = planProgress(p);
  if (!p?.goals?.length) return `<section class="card empty"><h2>No plan yet</h2><p class="muted">Complete the assessment to generate a plan.</p></section>`;
  const cs = doc.checkins || [];
  const active = p.goals.filter(g => g.status !== "Later");
  const goalsDone = active.filter(g => g.status === "Done").length;
  const applied = cs.filter(c => (c.applied || "").trim()).length;
  const rc = realityCheck(doc); const who = editable ? "you" : "they";
  return `<section class="card stack" style="gap:10px">
      <div class="row between"><div><span class="eyebrow">90-day development plan</span><h2>${editable ? "My plan" : "Their plan"}</h2></div><span class="mono" style="font-size:1.4rem">${prog}%</span></div>
      <div class="prog" role="img" aria-label="${prog}% of actions done"><b style="width:${prog}%"></b></div>
      <p class="muted small">Started ${fmtDate(p.createdAt)} · actions follow 70-20-10: <span class="tag7">70</span> practice on the job, <span class="tag7">20</span> learning from people, <span class="tag7">10</span> formal learning.</p>
      <div class="sep stack" style="gap:8px"><b>Is it working? ${src("PAW")} ${src("APTM")}</b>
        <div class="kirk">
          <div><span class="small muted">Reaction</span><div class="v">${cs[0] ? cs[0].energy + "/5" : "—"}</div><span class="small muted">energy${cs[0]?.prod ? ` · productivity ${cs[0].prod}/5` : ""} at last check-in</span></div>
          <div><span class="small muted">Learning</span><div class="v">${prog}%</div><span class="small muted">of actions done</span></div>
          <div><span class="small muted">Behaviour</span><div class="v">${applied}</div><span class="small muted">times applied on the job</span></div>
          <div><span class="small muted">Results</span><div class="v">${goalsDone}/${active.length}</div><span class="small muted">active goals met${active.length < p.goals.length ? ` · ${p.goals.length - active.length} parked` : ""}</span></div>
        </div></div>
      <div class="sep stack" style="gap:6px"><b>Reality check</b>
        <p class="small">${rc.over
          ? `<span class="chip crit">Plan is bigger than the time available</span> This plan has <b>${rc.open}</b> open actions. With ${esc(HOURS[doc.assessment?.hours ?? 1].toLowerCase())}, ${who} have realistic time for about <b>${rc.feasible}</b> in 90 days (at roughly ${HOURS_PER_ACTION} hours per action). ${editable ? "You" : "They"} will not finish everything in 90 days. Work through the actions in order and expect the rest to run over, or agree more development time.`
          : `<span class="chip ok">Fits the time available</span> <b>${rc.open}</b> open actions against realistic time for about <b>${rc.feasible}</b> (roughly ${HOURS_PER_ACTION} hours per action).`}
          ${active.length < p.goals.length ? ` <b>${p.goals.length - active.length}</b> goal${p.goals.length - active.length > 1 ? "s are" : " is"} parked because ${who} don't have time for ${p.goals.length - active.length > 1 ? "them" : "it"} yet. Bring one back only when another is done.` : ""}</p>
        <p class="small muted">Some outcomes depend on other people: pay, promotion, recognition, flexible arrangements. The plan can make ${editable ? "you" : "them"} ready and make the case. It cannot guarantee the outcome, and ${editable ? "your manager" : "you"} should not promise it.</p></div>
    </section>
    ${extra}
    ${p.goals.map(g => renderGoal(g, editable, rc.verdicts[g.id])).join("")}
    ${editable ? `<section class="card stack" style="gap:10px"><h3>Add your own goal</h3><div class="add"><input type="text" id="new-goal" placeholder="e.g. Get my forklift licence" aria-label="New goal"><button class="btn sm" data-action="add-goal">Add goal</button></div></section>` : ""}`;

// ---------- Persistence ----------
let saveT = null;
function saveMe(now){
  if (S.demo) return; // sample data is never saved
  S.myDoc.updatedAt = new Date().toISOString();
  if (!S.live){ lsSet(LS_KEY, S.myDoc); return; }
  clearTimeout(saveT);
  saveT = setTimeout(writeMe, now ? 0 : 700);
}
let writing = false, again = false;
async function writeMe(){
  if (S.readOnly) return;
  if (writing){ again = true; return; }
  writing = true;
  try { await S.db.doc("people/" + S.meId).set(clone(S.myDoc)); }
  catch (e){ if (e?.code === "invalid_argument"){ S.readOnly = true; render(); } else toast("Couldn't save. Check your connection and try again."); }
  writing = false;
  if (again){ again = false; writeMe(); }
}
const noteTimers = {};
function saveNote(empId, patch){
  S.notes[empId] = {...(S.notes[empId] || {}), ...patch, updatedAt: new Date().toISOString()};
  if (!S.live || S.demo) return;
  clearTimeout(noteTimers[empId]);
  noteTimers[empId] = setTimeout(() => S.db.collection("data/users/" + S.meId).doc("note-" + empId).set({empId, ...S.notes[empId]}).catch(() => toast("Couldn't save your note.")), 800);
}

// ---------- Events ----------
function curDoc(){ return S.demo ? (S.demoTeam.find(p => p.id === S.persona)?.doc || S.myDoc) : S.myDoc; }
function findGoal(id){ return curDoc().plan.goals.find(g => g.id === id); }
document.addEventListener("click", e => {
  const el = e.target.closest("[data-action]"); if (!el) return;
  if (el.matches("input, select")) return; // handled on change
  const act = el.dataset.action; const A = S.assess;
  if (el.tagName === "A") e.preventDefault();
  switch (act){
    case "view": S.view = el.dataset.v; S.sel = S.demo && S.view === "team" ? "ex2" : null; scrollTo(0, 0); break;
    case "start": case "retake": {
      const prev = S.myDoc.assessment?.why ? S.myDoc.assessment : null;
      const order = DRIVERS.map(d => d.key).sort(() => Math.random() - .5);
      S.assess = {step: 0, order, track: prev?.track ?? S.myDoc.assessment?.track, tenure: prev?.tenure ?? S.myDoc.assessment?.tenure, title: S.myDoc.title || "",
        why: {...(prev?.why || {})}, needs: {...(prev?.needs || {})}, needSrc: {...(prev?.needSrc || {})}, style: {conds: [], ...clone(prev?.style || {})}, beliefs: {...(prev?.beliefs || {})}, goalO: prev?.goalO,
        ratings: {...(S.myDoc.assessment?.ratings || {})}, top: [...(S.myDoc.assessment?.top || [])], deep: {...(S.myDoc.assessment?.deep || {})},
        direction: prev?.direction, dirDetail: prev?.dirDetail || "", blockers: [...(prev?.blockers || [])], hours: prev?.hours};
      S.view = "me"; break; }
    case "cancel": S.assess = null; break;
    case "back": A.step--; scrollTo(0, 0); break;
    case "next":
      if (A.step === ST.rewards && A.top.length !== 3) A.top = [...DRIVERS].sort((a, b) => (A.ratings[b.key] || 0) - (A.ratings[a.key] || 0)).slice(0, 3).map(d => d.key);
      if (A.step === ST.top) Object.keys(A.deep).forEach(k => { if (!A.top.includes(k)) delete A.deep[k]; });
      if (A.step < STEPS.length - 1){ A.step++; scrollTo(0, 0); break; }
      { const {step, order, title, ...ans} = A;
        if (S.myDoc.assessment?.completedAt && S.myDoc.plan) S.myDoc.history = [...(S.myDoc.history || []), {completedAt: S.myDoc.assessment.completedAt, top: S.myDoc.assessment.top, progress: planProgress(S.myDoc.plan)}].slice(-6);
        S.myDoc.title = title.trim();
        S.myDoc.assessment = {...ans, dirDetail: (ans.dirDetail || "").trim(), completedAt: todayISO()};
        S.myDoc.plan = makePlan(S.myDoc.assessment);
        S.assess = null; S.demo = false; S.demoTouched = true; saveMe(true); scrollTo(0, 0); toast("Your plan is ready"); }
      break;
    case "add-act": {
      const inp = $("#na-" + el.dataset.g); const text = inp.value.trim(); if (!text) return;
      findGoal(el.dataset.g).actions.push({id: uid(), type: $("#nt-" + el.dataset.g).value, text, done: false});
      inp.value = ""; inp.blur(); saveMe(); break; }
    case "del-act": { const g = findGoal(el.dataset.g); g.actions = g.actions.filter(a => a.id !== el.dataset.a); saveMe(); break; }
    case "add-goal": {
      const inp = $("#new-goal"); const t = inp.value.trim(); if (!t) return;
      curDoc().plan.goals.push({id: uid(), driver: "own", title: t, measure: "", due: addDays(90), status: "Not started", actions: []});
      inp.value = ""; inp.blur(); saveMe(); break; }
    case "del-goal": curDoc().plan.goals = curDoc().plan.goals.filter(g => g.id !== el.dataset.g); saveMe(); break;
    case "checkin": {
      if (!S.energy){ toast("Pick an energy level first"); return; }
      const v = id => $(id).value.trim();
      const d = curDoc(); d.checkins = [{date: todayISO(), energy: S.energy, prod: S.prod, wins: v("#ci-wins"), applied: v("#ci-applied"), attrib: S.attrib, needs: v("#ci-needs")}, ...(d.checkins || [])].slice(0, 24);
      S.energy = null; S.prod = null; S.attrib = ""; document.activeElement?.blur(); saveMe(true); toast("Check-in saved"); break; }
    case "filter": S.filter = el.dataset.f; break;
    case "demo": S.demo = !S.demo; S.demoTouched = true; S.sel = S.demo && S.view === "team" ? "ex2" : null; S.assess = null; break;
    case "persona": S.persona = el.dataset.id; S.reqOpen = null; break;
    case "sk-add": { const c = [...CATALOG.tech, ...CATALOG.non].find(x => x.id === el.dataset.c); const d = curDoc();
      d.skills = [...(d.skills || []), {id: uid(), cat: c.id, name: c.name, kind: c.kind, area: c.area, stage: 0, reps: 0, target: "", evidence: "", requests: []}]; saveMe(); toast(`Added ${c.name}`); break; }
    case "sk-own": { const name = $("#sk-name").value.trim(); if (!name) return; const d = curDoc();
      d.skills = [...(d.skills || []), {id: uid(), cat: null, name, kind: $("#sk-kind").value, area: "", stage: 0, reps: 0, target: "", evidence: "", requests: []}]; saveMe(); break; }
    case "sk-del": { const d = curDoc(); d.skills = d.skills.filter(x => x.id !== el.dataset.s); saveMe(); break; }
    case "sk-stage": { const x = curDoc().skills.find(y => y.id === el.dataset.s); const to = x.stage + +el.dataset.d;
      if (to === 3 && x.kind === "skill" && (x.reps || 0) < MASTERY_REPS){ toast(`Log ${MASTERY_REPS} independent practices first, or ask for sign-off.`); return; }
      x.stage = Math.max(0, Math.min(3, to)); saveMe(); if (x.stage === 3) toast(x.kind === "cert" ? "Certified. Add your evidence." : "Mastered. Add your evidence."); break; }
    case "sk-rep": { const x = curDoc().skills.find(y => y.id === el.dataset.s); x.reps = (x.reps || 0) + 1; if (x.stage < 2) x.stage = 2; saveMe(); break; }
    case "sk-ask": S.reqOpen = S.reqOpen === el.dataset.s ? null : el.dataset.s; break;
    case "sk-send": { const x = curDoc().skills.find(y => y.id === el.dataset.s);
      x.requests = [...(x.requests || []), {id: uid(), type: $("#rq-type-" + x.id).value, note: $("#rq-note-" + x.id).value.trim(), date: todayISO()}];
      S.reqOpen = null; saveMe(true); toast("Sent to your manager"); break; }
    case "respond": { const emp = el.dataset.p, rid = el.dataset.r; const reply = ($("#reply-" + rid)?.value || "").trim();
      const r = {status: el.dataset.st, reply, date: new Date().toISOString()};
      if (S.demo){ S.demoResp[emp] = {...(S.demoResp[emp] || {}), [rid]: r}; }
      else { S.myDoc.responses = {...(S.myDoc.responses || {}), [emp]: {...(S.myDoc.responses?.[emp] || {}), [rid]: r}}; saveMe(true); }
      toast("Reply sent"); break; }
    case "toggle-add": S.showAdd = !S.showAdd; break;
    case "add-member": S.myDoc.team = [...new Set([...(S.myDoc.team || []), el.dataset.id])]; saveMe(true); toast("Added to your team"); break;
    case "remove-member": S.myDoc.team = (S.myDoc.team || []).filter(i => i !== el.dataset.id); S.sel = null; saveMe(true); break;
    case "select": S.sel = S.sel === el.dataset.id ? null : el.dataset.id; render(true); if (S.sel) $("#sel-panel")?.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"}); return;
    default: return;
  }
  render(true);
});
document.addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches("tr[data-action=select]")){ e.preventDefault(); e.target.click(); }
});
document.addEventListener("change", e => {
  const el = e.target; const A = S.assess; const act = el.dataset.action;
  if (!act) return;
  if (act === "set"){ A[el.dataset.f] = el.value; if (el.dataset.f === "direction") A.dirDetail = ""; if (el.dataset.f === "track") A.deep = {}; }
  else if (act === "rate") A[el.dataset.g][el.dataset.k] = +el.value;
  else if (act === "top"){
    if (el.checked && A.top.length >= 3){ el.checked = false; toast("Pick exactly 3. Untick one first."); return; }
    A.top = el.checked ? [...A.top, el.value] : A.top.filter(k => k !== el.value);
  }
  else if (act === "deep") A.deep[el.dataset.k] = +el.value;
  else if (act === "needsrc") A.needSrc[el.dataset.k] = el.value;
  else if (act === "style") A.style[el.dataset.k] = el.dataset.k === "peak" ? +el.value : el.value;
  else if (act === "cond"){
    if (el.checked && A.style.conds.length >= 4){ el.checked = false; toast("Pick up to 4."); return; }
    A.style.conds = el.checked ? [...A.style.conds, el.value] : A.style.conds.filter(k => k !== el.value);
  }
  else if (act === "blocker") A.blockers = el.checked ? [...A.blockers, el.value] : A.blockers.filter(k => k !== el.value);
  else if (act === "hours") A.hours = +el.value;
  else if (act === "energy"){ S.energy = +el.value; return; }
  else if (act === "prod"){ S.prod = +el.value; return; }
  else if (act === "sk-target"){ curDoc().skills.find(y => y.id === el.dataset.s).target = el.value; saveMe(); }
  else if (act === "move"){ const cur = S.notes[el.dataset.p]?.moves || {}; saveNote(el.dataset.p, {moves: {...cur, [el.dataset.m]: el.checked}}); }
  else if (act === "attrib"){ S.attrib = el.value; const tip = el.parentElement.querySelector(".tip"); const need = S.attrib === "ability" || S.attrib === "luck";
    if (need && !tip) el.insertAdjacentHTML("afterend", `<p class="tip">Ability and luck are hard to repeat on purpose. Was there something you did, an effort or approach, that also helped? That part is in your control.</p>`);
    if (!need && tip) tip.remove(); return; }
  else if (act === "toggle"){ const g = findGoal(el.dataset.g); const a = g.actions.find(x => x.id === el.dataset.a); a.done = el.checked;
    if (g.actions.every(x => x.done)) g.status = "Done"; else if (g.actions.some(x => x.done) && g.status === "Not started") g.status = "In progress"; saveMe(); }
  else if (act === "status"){ findGoal(el.dataset.g).status = el.value; saveMe(); }
  render(true);
});
document.addEventListener("input", e => {
  const el = e.target;
  if (el.dataset.input && S.assess) S.assess[el.dataset.input] = el.value;
  if (el.dataset.sinput && S.assess) S.assess.style[el.dataset.sinput] = el.value;
  if (el.dataset.note) saveNote(el.dataset.note, {text: el.value});
  if (el.dataset.ev){ curDoc().skills.find(y => y.id === el.dataset.ev).evidence = el.value; saveMe(); }
});

// ---------- Boot ----------
const local = lsGet(LS_KEY); if (local) S.myDoc = local;
S.demo = !S.myDoc.assessment?.why;
render();

(async () => {
  if (!window.claude?.use) return;
  const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
  if (!db || !user) return;
  const id = await user.id(); if (!id) return;
  S.db = db; S.user = user; S.meId = id; S.live = true;
  const w = await user.can("data.write"); if (w === false) S.readOnly = true;
  let loadedMine = false, knownIds = "";
  db.collection("people").onSnapshot(async snap => {
    const people = {};
    snap.docs.forEach(d => { people[d.id] = d.data(); });
    S.people = people;
    if (!loadedMine){
      loadedMine = true;
      if (people[id]) S.myDoc = clone(people[id]);
      else if (local?.assessment?.completedAt){ S.myDoc = local; saveMe(true); } // carry a preview plan over on first sign-in
      else S.myDoc = {};
      if (!S.demoTouched && !S.assess) S.demo = !S.myDoc.assessment?.why;
    }
    const ids = Object.keys(people).sort().join(",");
    if (ids !== knownIds){
      knownIds = ids;
      const ps = await user.profiles(Object.keys(people));
      Object.values(ps).forEach(p => { S.names[p.id] = p.name || ""; S.avatars[p.id] = p.avatarUrl; });
    }
    render();
  }, () => toast("Live updates stopped. Reload the page to reconnect."));
  db.collection("data/users/" + id).onSnapshot(snap => {
    snap.docs.forEach(d => { const v = d.data(); if (v?.empId && document.activeElement?.dataset?.note !== v.empId) S.notes[v.empId] = v; });
    render();
  }, () => {});
})();
</script>
</body>
