      <nav class="card bp-toc" aria-label="${es ? "Contenido" : "Contents"}"><span class="eyebrow">${es ? "Contenido" : "Contents"}</span>
        ${d.sections.map(x => `<button data-action="bp-go" data-id="${x.id}">${esc(x.title)}</button>`).join("")}</nav>
      <article class="card bp" data-notr>${d.sections.map(x => `<section id="${x.id}"><h2>${esc(x.title)}</h2>${x.html}</section>`).join("")}</article>
    </div>`;
}

// ---------- Foundations ----------
function renderFoundations(){
  const books = [
    {k:"SDT", color:"var(--in)", title:"Self-Determination Theory", by:"Richard M. Ryan & Edward L. Deci",
     use:["The motivation continuum, from amotivation through external, introjected and identified regulation to intrinsic motivation, summarised as a relative autonomy score","The three basic psychological needs: autonomy, competence and relatedness","How rewards and feedback can feel controlling or informational, and how controlling ones can undermine intrinsic motivation","Autonomy support, structure and involvement as the manager's levers"],
     where:"\"Why you work\" and \"Your needs\" steps, including what each low need is related to · motivation quality on the profile and team table · Foundation goal · coaching playbook"},
    {k:"HCM", color:"var(--focus)", title:"Handbook of Competence and Motivation (2nd ed.)", by:"Andrew J. Elliot, Carol S. Dweck & David S. Yeager (eds.)",
     use:["Competence as the core of achievement motivation","Achievement goals: mastery vs performance, approach vs avoidance","Implicit theories of ability (growth vs fixed mindset) and how they shape responses to setbacks"],
     where:"\"Beliefs\" step · mindset and goal-focus on the profile · mistake-to-lesson and self-comparison actions · process-focused praise guidance"},
    {k:"HL", color:"var(--ex)", title:"Human Learning (8th ed.)", by:"Jeanne Ellis Ormrod",
     use:["Social cognitive theory: self-efficacy and its sources (mastery experiences, modelling, encouragement)","Self-regulated learning: goal setting, self-monitoring and reflection","Attribution theory: crediting controllable causes like effort and strategy","Spaced practice, self-testing and transfer of learning to the job"],
     where:"Confidence score · small-wins and peer-modelling actions · monthly check-in with transfer and attribution prompts · study tips inside learning actions"},
    {k:"PAW", color:"var(--crit)", title:"Psychology Applied to Work (13th ed.)", by:"Satoris S. Howes & Paul M. Muchinsky",
     use:["Goal-setting theory: specific, challenging goals with feedback","Expectancy theory: effort → performance → valued outcome","Equity and organisational justice","The job characteristics model for job crafting","Evaluating training at reaction, learning, behaviour and results levels","Work teams and group processes, including identification with the team"],
     where:"\"Success looks like\" on every goal · effort, reward and fairness beliefs · fairness flag · job-crafting actions · team identity and work-mode questions · \"Is it working?\" panel"},
    {k:"APTM", color:"var(--ok)", title:"Applied Psychology in Talent Management (9th ed.)", by:"Wayne F. Cascio & Herman Aguinis",
     use:["Person-level development needs assessment","Performance management as ongoing coaching and feedback rather than a once-a-year event","Career development across career stages","Fair, job-related and appropriate use of assessment information"],
     where:"The assessment tree itself · career-stage branch · monthly check-ins and manager view · use limits below"}
  ];
  return `<section class="stack" style="gap:6px"><span class="eyebrow">The research behind the app</span><h1>Foundations</h1>
    <p class="muted" style="max-width:68ch">Every step of the assessment, every plan action and every coaching tip traces back to one of these five works. Look for the short tags (for example ${src("SDT")}) next to guidance in the app.</p></section>
    <div class="books">${books.map(b => `<article class="card book"><div class="spine" style="background:${b.color}"></div>
      <div class="row between"><h3>${esc(b.title)}</h3>${src(b.k)}</div><p class="muted small">${esc(b.by)}</p>
      <div><b class="small">What we use</b><ul>${b.use.map(u => `<li>${esc(u)}</li>`).join("")}</ul></div>
      <p class="small"><b>Where you see it:</b> <span class="muted">${esc(b.where)}</span></p></article>`).join("")}</div>
    <section class="card stack" style="gap:8px"><h2>Use with care</h2>
      <ul class="guide">
        <li>The questions were written for this app, following the structure of these frameworks. They are not reproductions of published scales and have not been validated as a psychometric test.</li>
        <li>Use results to start development conversations only. Do not use them for hiring, pay, promotion, ratings or discipline decisions.</li>
        <li>The 70-20-10 split is a practitioner rule of thumb, not a research finding. Here it simply organises actions into practice, learning from people, and formal learning.</li>
        <li>People change. Encourage a retake every 90 days, and treat scores as a snapshot, not a label.</li>
      </ul></section>`;
}

// ---------- Persistence ----------
let saveT = null;
function saveMe(now){
  if (S.demo) return; // sample data is never saved
  S.myDoc.updatedAt = new Date().toISOString();
  if (!S.live){ lsSet(LS_KEY, S.myDoc); return; }
  clearTimeout(saveT);
  saveT = setTimeout(writeMe, now ? 0 : 700);
}
let writing = false, again = false;
async function writeMe(){
  if (S.readOnly) return;
  if (writing){ again = true; return; }
  writing = true;
  try {
    await S.db.doc("data/users/" + S.meId + "/profile").set(clone(S.myDoc));   // full record: private to the employee
    await S.db.doc("people/" + S.meId).set(publishedDoc(S.myDoc));             // only what they chose to share
  }
  catch (e){ if (e?.code === "invalid_argument"){ S.readOnly = true; render(); } else toast("Couldn't save. Check your connection and try again."); }
  writing = false;
  if (again){ again = false; writeMe(); }
}
const noteTimers = {};
function saveNote(empId, patch){
  S.notes[empId] = {...(S.notes[empId] || {}), ...patch, updatedAt: new Date().toISOString()};
  if (!S.live || S.demo) return;
  clearTimeout(noteTimers[empId]);
  noteTimers[empId] = setTimeout(() => S.db.collection("data/users/" + S.meId).doc("note-" + empId).set({empId, ...S.notes[empId]}).catch(() => toast("Couldn't save your note.")), 800);
}

// ---------- Events ----------
function curDoc(){ return S.demo ? (S.demoTeam.find(p => p.id === S.persona)?.doc || S.myDoc) : S.myDoc; }
function findGoal(id){ return curDoc().plan.goals.find(g => g.id === id); }
document.addEventListener("click", e => {
  const el = e.target.closest("[data-action]"); if (!el) return;
  if (el.matches("input, select")) return; // handled on change
  const act = el.dataset.action; const A = S.assess;
  if (el.tagName === "A") e.preventDefault();
  switch (act){
    case "lang": LANG = el.dataset.l; try { localStorage.setItem("gc-lang", LANG); } catch {} break;
    case "bp-go": document.getElementById(el.dataset.id)?.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"}); return;
    case "view": S.view = el.dataset.v; S.sel = S.demo && S.view === "team" ? "ex2" : null; scrollTo(0, 0); break;
    case "start": case "retake": {
      const prev = S.myDoc.assessment?.why ? S.myDoc.assessment : null;
      const order = DRIVERS.map(d => d.key).sort(() => Math.random() - .5);
      S.assess = {step: 0, order, track: prev?.track ?? S.myDoc.assessment?.track, tenure: prev?.tenure ?? S.myDoc.assessment?.tenure, title: S.myDoc.title || "",
        why: {...(prev?.why || {})}, needs: {...(prev?.needs || {})}, needSrc: {...(prev?.needSrc || {})}, style: {conds: [], ...clone(prev?.style || {})}, beliefs: {...(prev?.beliefs || {})}, goalO: prev?.goalO,
        ratings: {...(S.myDoc.assessment?.ratings || {})}, top: [...(S.myDoc.assessment?.top || [])], deep: {...(S.myDoc.assessment?.deep || {})},
        direction: prev?.direction, dirDetail: prev?.dirDetail || "", blockers: [...(prev?.blockers || [])], hours: prev?.hours, ownHours: prev?.ownHours ?? 0, learnAgenda: prev?.learnAgenda || ""};
      S.view = "me"; break; }
    case "cancel": S.assess = null; break;
    case "back": A.step--; scrollTo(0, 0); break;
    case "next":
      if (A.step === ST.rewards && A.top.length !== 3) A.top = [...DRIVERS].sort((a, b) => (A.ratings[b.key] || 0) - (A.ratings[a.key] || 0)).slice(0, 3).map(d => d.key);
      if (A.step === ST.top) Object.keys(A.deep).forEach(k => { if (!A.top.includes(k)) delete A.deep[k]; });
      if (A.step < STEPS.length - 1){ A.step++; scrollTo(0, 0); break; }
      { const {step, order, title, ...ans} = A;
        if (S.myDoc.assessment?.completedAt && S.myDoc.plan) S.myDoc.history = [...(S.myDoc.history || []), {completedAt: S.myDoc.assessment.completedAt, top: S.myDoc.assessment.top, progress: planProgress(S.myDoc.plan)}].slice(-6);
        S.myDoc.title = title.trim();
        S.myDoc.assessment = {...ans, dirDetail: (ans.dirDetail || "").trim(), learnAgenda: (ans.learnAgenda || "").trim(), completedAt: todayISO()};
        S.myDoc.plan = makePlan(S.myDoc.assessment);
        S.assess = null; S.demo = false; S.demoTouched = true; saveMe(true); scrollTo(0, 0); toast("Your plan is ready"); }
      break;
    case "add-act": {
      const inp = $("#na-" + el.dataset.g); const text = inp.value.trim(); if (!text) return;
      findGoal(el.dataset.g).actions.push({id: uid(), type: $("#nt-" + el.dataset.g).value, text, done: false});
      inp.value = ""; inp.blur(); saveMe(); break; }
    case "del-act": { const g = findGoal(el.dataset.g); g.actions = g.actions.filter(a => a.id !== el.dataset.a); saveMe(); break; }
    case "add-goal": {
      const inp = $("#new-goal"); const t = inp.value.trim(); if (!t) return;
      curDoc().plan.goals.push({id: uid(), driver: "own", title: t, measure: "", due: addDays(90), status: "Not started", actions: []});
      inp.value = ""; inp.blur(); saveMe(); break; }
    case "del-goal": curDoc().plan.goals = curDoc().plan.goals.filter(g => g.id !== el.dataset.g); saveMe(); break;
    case "checkin": {
      if (!S.energy){ toast("Pick an energy level first"); return; }
      const v = id => $(id).value.trim();
      const d = curDoc(); d.checkins = [{date: todayISO(), energy: S.energy, prod: S.prod, wins: v("#ci-wins"), applied: v("#ci-applied"), portable: v("#ci-portable"), attrib: S.attrib, needs: v("#ci-needs")}, ...(d.checkins || [])].slice(0, 24);
      S.energy = null; S.prod = null; S.attrib = ""; document.activeElement?.blur(); saveMe(true); toast("Check-in saved"); break; }
    case "filter": S.filter = el.dataset.f; break;
    case "demo": S.demo = !S.demo; S.demoTouched = true; S.sel = S.demo && S.view === "team" ? "ex2" : null; S.assess = null; break;
    case "persona": S.persona = el.dataset.id; S.reqOpen = null; break;
    case "sk-add": { const c = [...CATALOG.tech, ...CATALOG.non].find(x => x.id === el.dataset.c); const d = curDoc();
      d.skills = [...(d.skills || []), {id: uid(), cat: c.id, name: c.name, kind: c.kind, area: c.area, stage: 0, reps: 0, target: "", evidence: "", requests: []}]; saveMe(); toast(`Added ${c.name}`); break; }
    case "sk-own": { const name = $("#sk-name").value.trim(); if (!name) return; const d = curDoc();
      d.skills = [...(d.skills || []), {id: uid(), cat: null, name, kind: $("#sk-kind").value, area: "", stage: 0, reps: 0, target: "", evidence: "", requests: []}]; saveMe(); break; }
    case "sk-del": { const d = curDoc(); d.skills = d.skills.filter(x => x.id !== el.dataset.s); saveMe(); break; }
    case "sk-stage": { const x = curDoc().skills.find(y => y.id === el.dataset.s); const to = x.stage + +el.dataset.d;
      if (to === 3 && x.kind === "skill" && (x.reps || 0) < MASTERY_REPS){ toast(`Log ${MASTERY_REPS} independent practices first, or ask for sign-off.`); return; }
      x.stage = Math.max(0, Math.min(3, to)); saveMe(); if (x.stage === 3) toast(x.kind === "cert" ? "Certified. Add your evidence." : "Mastered. Add your evidence."); break; }
    case "sk-rep": { const x = curDoc().skills.find(y => y.id === el.dataset.s); x.reps = (x.reps || 0) + 1; if (x.stage < 2) x.stage = 2; saveMe(); break; }
    case "passport": {
      const d = curDoc(); const done = (d.skills || []).filter(x => x.stage === 3);
      const lessons = (d.checkins || []).map(c => c.portable).filter(Boolean);
      const txt = [tr("SKILLS AND CERTIFICATIONS"), ...done.map(x => `- ${x.name} (${tr(x.kind === "cert" ? "certified" : "mastered")})${x.evidence ? `: ${x.evidence}` : ""}`),
        ...(d.assessment?.style?.talent && d.assessment.style.talentProof ? ["", tr("STRENGTH"), `- ${d.assessment.style.talent}: ${d.assessment.style.talentProof}`] : []),
        ...(lessons.length ? ["", tr("RECENT LEARNING"), ...lessons.slice(0, 5).map(l => `- ${l}`)] : [])].join("\n");
      const fallback = () => { const ta = $("#passport-text"); ta.hidden = false; ta.value = txt; ta.style.minHeight = "140px"; ta.focus(); ta.select(); toast("Select all and copy"); };
      try { navigator.clipboard.writeText(txt).then(() => toast("Passport copied"), fallback); } catch { fallback(); }
      return; }
    case "sk-ask": S.reqOpen = S.reqOpen === el.dataset.s ? null : el.dataset.s; break;
    case "sk-send": { const x = curDoc().skills.find(y => y.id === el.dataset.s);
      x.requests = [...(x.requests || []), {id: uid(), type: $("#rq-type-" + x.id).value, note: $("#rq-note-" + x.id).value.trim(), date: todayISO()}];
      S.reqOpen = null; saveMe(true); toast("Sent to your manager"); break; }
    case "respond": { const emp = el.dataset.p, rid = el.dataset.r; const reply = ($("#reply-" + rid)?.value || "").trim();
      const r = {status: el.dataset.st, reply, date: new Date().toISOString()};
      if (S.demo){ S.demoResp[emp] = {...(S.demoResp[emp] || {}), [rid]: r}; }
      else { S.myDoc.responses = {...(S.myDoc.responses || {}), [emp]: {...(S.myDoc.responses?.[emp] || {}), [rid]: r}}; saveMe(true); }
      toast("Reply sent"); break; }
    case "share-clear-mgr": curDoc().managerId = null; saveMe(true); break;
    case "share-remove": { const d = curDoc(); d.shares = (d.shares || []).filter(x => x.id !== el.dataset.id); saveMe(true); break; }
    case "share-add": { const d = curDoc(); d.shares = [...(d.shares || []), {id: el.dataset.id, sections: ["plan", "skills"]}]; saveMe(true); break; }
    case "pick": { const d = curDoc(); const id = el.dataset.id; S.names[id] = el.dataset.name || S.names[id];
      if (el.dataset.kind === "manager"){ d.managerId = id; d.shares = (d.shares || []).filter(x => x.id !== id); }
      else if (id !== d.managerId && !(d.shares || []).some(x => x.id === id)) d.shares = [...(d.shares || []), {id, sections: ["plan", "skills"]}];
      saveMe(true); toast("Sharing updated"); break; }
    case "select": S.sel = S.sel === el.dataset.id ? null : el.dataset.id; render(true); if (S.sel) $("#sel-panel")?.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"}); return;
    default: return;
  }
  render(true);
});
document.addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches("tr[data-action=select]")){ e.preventDefault(); e.target.click(); }
});
document.addEventListener("change", e => {
  const el = e.target; const A = S.assess; const act = el.dataset.action;
  if (!act) return;
  if (act === "set"){ A[el.dataset.f] = el.value; if (el.dataset.f === "direction") A.dirDetail = ""; if (el.dataset.f === "track") A.deep = {}; }
  else if (act === "rate") A[el.dataset.g][el.dataset.k] = +el.value;
  else if (act === "top"){
    if (el.checked && A.top.length >= 3){ el.checked = false; toast("Pick exactly 3. Untick one first."); return; }
    A.top = el.checked ? [...A.top, el.value] : A.top.filter(k => k !== el.value);
  }
  else if (act === "deep") A.deep[el.dataset.k] = +el.value;
  else if (act === "needsrc") A.needSrc[el.dataset.k] = el.value;
  else if (act === "style") A.style[el.dataset.k] = el.dataset.k === "peak" ? +el.value : el.value;
  else if (act === "cond"){
    if (el.checked && A.style.conds.length >= 4){ el.checked = false; toast("Pick up to 4."); return; }
    A.style.conds = el.checked ? [...A.style.conds, el.value] : A.style.conds.filter(k => k !== el.value);
  }
  else if (act === "blocker") A.blockers = el.checked ? [...A.blockers, el.value] : A.blockers.filter(k => k !== el.value);
  else if (act === "hours") A.hours = +el.value;
  else if (act === "own") A.ownHours = +el.value;
  else if (act === "energy"){ S.energy = +el.value; return; }
  else if (act === "prod"){ S.prod = +el.value; return; }
  else if (act === "share-sec"){ const x = (curDoc().shares || []).find(y => y.id === el.dataset.id); x.sections = el.checked ? [...new Set([...x.sections, el.dataset.sec])] : x.sections.filter(k => k !== el.dataset.sec);
    if (!x.sections.length) curDoc().shares = curDoc().shares.filter(y => y !== x); saveMe(true); }
  else if (act === "sk-target"){ curDoc().skills.find(y => y.id === el.dataset.s).target = el.value; saveMe(); }
  else if (act === "move"){ const cur = S.notes[el.dataset.p]?.moves || {}; saveNote(el.dataset.p, {moves: {...cur, [el.dataset.m]: el.checked}}); }
  else if (act === "attrib"){ S.attrib = el.value; const tip = el.parentElement.querySelector(".tip"); const need = S.attrib === "ability" || S.attrib === "luck";
    if (need && !tip){ el.insertAdjacentHTML("afterend", `<p class="tip">Ability and luck are hard to repeat on purpose. Was there something you did, an effort or approach, that also helped? That part is in your control.</p>`); translateDom(el.parentElement); }
    if (!need && tip) tip.remove(); return; }
  else if (act === "toggle"){ const g = findGoal(el.dataset.g); const a = g.actions.find(x => x.id === el.dataset.a); a.done = el.checked;
    if (g.actions.every(x => x.done)) g.status = "Done"; else if (g.actions.some(x => x.done) && g.status === "Not started") g.status = "In progress"; saveMe(); }
  else if (act === "status"){ findGoal(el.dataset.g).status = el.value; saveMe(); }
  render(true);
});
document.addEventListener("input", e => {
  const el = e.target;
  if (el.dataset.input && S.assess) S.assess[el.dataset.input] = el.value;
  if (el.dataset.sinput && S.assess) S.assess.style[el.dataset.sinput] = el.value;
  if (el.dataset.note) saveNote(el.dataset.note, {text: el.value});
  if (el.dataset.pick && S.user){
    const kind = el.dataset.pick, box = $("#pick-" + kind + "-res");
    S.user.search(el.value).then(hits => {
      box.replaceChildren(...hits.filter(h => h.id !== S.meId).map(h => { const b = document.createElement("button"); b.className = "pick-hit"; b.dataset.action = "pick"; b.dataset.kind = kind; b.dataset.id = h.id; b.dataset.name = h.name; b.textContent = h.name; return b; }));
      if (!hits.length && el.value.trim()) box.textContent = tr("No one found. Check the spelling, or ask them to open this page first.");
    });
  }
  if (el.dataset.ev){ curDoc().skills.find(y => y.id === el.dataset.ev).evidence = el.value; saveMe(); }
});

// ---------- Boot ----------
const local = lsGet(LS_KEY); if (local) S.myDoc = local;
S.demo = !S.myDoc.assessment?.why;
// Direct links: #sop, #team, #guide, #foundations, #growth (add -es for Spanish, e.g. #sop-es)
(() => { const m = (location.hash.slice(1) || "").match(/^(sop|team|guide|foundations|growth)(-es|-en)?$/); if (!m) return;
  S.view = {sop: "blueprint", team: "team", guide: "guide", foundations: "science", growth: "me"}[m[1]];
  if (S.view === "team" && S.demo) S.sel = "ex2";
  if (m[2]) LANG = m[2].slice(1); })();
render();

(async () => {
  if (!window.claude?.use) return;
  const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
  if (!db || !user) return;
  const id = await user.id(); if (!id) return;
  S.db = db; S.user = user; S.meId = id; S.live = true;
  const w = await user.can("data.write"); if (w === false) S.readOnly = true;
  let knownIds = "";
  const priv = await db.doc("data/users/" + id + "/profile").get().catch(() => null);
  if (priv?.exists) S.myDoc = clone(priv.data());
  else {
    const legacy = await db.doc("people/" + id).get().catch(() => null);
    if (legacy?.exists && legacy.data().assessment){ S.myDoc = clone(legacy.data()); saveMe(true); }       // move an older shared record into the private one
    else if (local?.assessment?.completedAt){ S.myDoc = local; saveMe(true); }                              // carry a preview plan over on first sign-in
    else S.myDoc = {};
  }
  if (!S.demoTouched && !S.assess) S.demo = !S.myDoc.assessment?.why;
  const mine = [S.myDoc.managerId, ...(S.myDoc.shares || []).map(x => x.id)].filter(Boolean);
  if (mine.length) Object.values(await user.profiles(mine)).forEach(p => { S.names[p.id] = p.name || ""; });
  render();
  db.collection("people").onSnapshot(async snap => {
    const people = {};
    snap.docs.forEach(d => { people[d.id] = d.data(); });
    S.people = people;
    const ids = Object.keys(people).sort().join(",");
    if (ids !== knownIds){
      knownIds = ids;
      const ps = await user.profiles(Object.keys(people));
      Object.values(ps).forEach(p => { S.names[p.id] = p.name || ""; S.avatars[p.id] = p.avatarUrl; });
    }
    render();
  }, () => toast("Live updates stopped. Reload the page to reconnect."));
  db.collection("data/users/" + id).onSnapshot(snap => {
    snap.docs.forEach(d => { const v = d.data(); if (v?.empId && document.activeElement?.dataset?.note !== v.empId) S.notes[v.empId] = v; });
    render();
  }, () => {});
})();
</script>
