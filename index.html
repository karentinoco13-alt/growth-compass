  "Build the confidence and conditions to grow":"Construir la confianza y las condiciones para crecer","Your needs and confidence scores improve when you retake the assessment in # days.":"Tus puntajes de necesidades y confianza mejoran cuando repites la evaluación en # días.",
  "Start with small wins and informational feedback. Ask about what's getting in the way before adding stretch.":"Empieza con pequeños logros y retroalimentación informativa. Pregunta qué está frenando antes de sumar retos.",
  "List the parts of your work where you'd like more say, and bring the list to your next #:#.":"Haz una lista de las partes de tu trabajo donde quisieras más voz y llévala a tu próxima reunión #:#.",
  "Start with one small, winnable task this week. Afterwards, write down what you did that made it work.":"Empieza esta semana con una tarea pequeña y alcanzable. Después, anota qué hiciste para que funcionara.",
  "Set up a regular #-minute catch-up with one teammate.":"Programa una conversación regular de # minutos con un compañero.",
  "Watch a peer at a similar level handle something you find hard, then try it yourself the same week.":"Observa a un compañero de nivel similar resolver algo que te cuesta y luego inténtalo tú esa misma semana.",
  "Keep a weekly \"mistake → lesson\" note: one thing that went wrong and what you'll try next time.":"Lleva una nota semanal de \"error → lección\": algo que salió mal y qué intentarás la próxima vez.",
  "Each month, compare your work with your own work last month, not with other people's.":"Cada mes, compara tu trabajo con tu propio trabajo del mes anterior, no con el de otras personas.",
  "Use your strengths more, in the way you work best":"Usa más tus fortalezas, de la forma en que trabajas mejor","More of your week goes to work that uses your strengths, and your productivity rating rises at check-ins.":"Más de tu semana se dedica a trabajo que usa tus fortalezas, y tu calificación de productividad sube en los seguimientos.",
  "Teach or support a teammate using your strength.":"Enseña o apoya a un compañero usando tu fortaleza.","Share one thing you're good at with a colleague in a short one-to-one walkthrough.":"Comparte algo en lo que eres bueno con un compañero en una breve explicación uno a uno.",
  "Build their strengths into their assignments.":"Incorpora sus fortalezas en sus asignaciones.",
  "A self-rating against the next role's competencies, reviewed with your manager, with gaps named.":"Una autoevaluación frente a las competencias del siguiente puesto, revisada con tu líder, con las brechas identificadas.",
  "Act up in parts of the next role: cover for the lead, run a huddle or own a handover.":"Asume partes del siguiente puesto: cubre al líder, dirige una reunión breve o hazte cargo de una entrega de turno.",
  "Interview someone in the role you want about what success looks like.":"Entrevista a alguien en el puesto que quieres sobre cómo se ve el éxito.","Review the competency profile for the role and rate yourself against it.":"Revisa el perfil de competencias del puesto y califícate frente a él.","Name readiness gaps honestly and create act-up opportunities.":"Nombra con honestidad las brechas de preparación y crea oportunidades para cubrir el puesto superior.",
  "Find the next role that fits you":"Encontrar el siguiente puesto que encaje contigo","Make your contributions visible":"Hacer visibles tus aportes","Three monthly wins notes sent and one piece of work presented to a wider group.":"Tres notas mensuales de logros enviadas y un trabajo presentado a un grupo más amplio.",
  "Send your manager a short monthly note of wins and what they made possible.":"Envía a tu líder una breve nota mensual con tus logros y lo que hicieron posible.","Present one piece of your work to a wider group this quarter.":"Presenta uno de tus trabajos a un grupo más amplio este trimestre.","Learn to describe impact clearly: situation, action, result.":"Aprende a describir el impacto con claridad: situación, acción, resultado.",
  "A written list of # or # results that support your next pay conversation, agreed with your manager.":"Una lista escrita de # o # resultados que respalden tu próxima conversación salarial, acordada con tu líder.",
  "Agree with your manager on # or # results that would support a pay conversation at the next review.":"Acuerda con tu líder # o # resultados que respalden una conversación salarial en la próxima evaluación.","Ask your manager or HR to walk you through the pay band and criteria for your role.":"Pide a tu líder o a RR. HH. que te explique la banda salarial y los criterios de tu puesto.","Keep a monthly wins log with numbers to bring to your review.":"Lleva un registro mensual de logros con cifras para tu evaluación.","Be transparent about how pay decisions work and which parts are within their control.":"Sé transparente sobre cómo se decide el salario y qué partes dependen de la persona.",
  "Written expectations for your role, agreed with your manager, and one in-demand skill in progress.":"Expectativas escritas para tu puesto, acordadas con tu líder, y una habilidad demandada en desarrollo.","Ask your manager to share team and business plans in your #:#s.":"Pide a tu líder que comparta los planes del equipo y del negocio en tus reuniones #:#.","Pick one in-demand skill for your role and complete training in it.":"Elige una habilidad muy demandada para tu puesto y completa una capacitación en ella.","Give early, honest information about changes and confirm expectations in writing.":"Da información temprana y honesta sobre los cambios y confirma las expectativas por escrito.",
  "A trial arrangement agreed and reviewed after # weeks.":"Un arreglo de prueba acordado y revisado después de # semanas.","Talk with teammates about swapping or sharing to cover peaks.":"Habla con tus compañeros sobre intercambiar o compartir para cubrir los picos.","Review the company's flexible-work policy and what options exist.":"Revisa la política de trabajo flexible de la empresa y qué opciones existen.","Trial a flexible arrangement and judge it on results.":"Prueba un arreglo flexible y evalúalo por resultados.",
  "Hold a #-minute monthly review with your manager on results, not activity.":"Ten una revisión mensual de # minutos con tu líder sobre resultados, no sobre actividad.","Learn a simple planning method (weekly priorities or a kanban board) and use it for a month.":"Aprende un método simple de planificación (prioridades semanales o un tablero kanban) y úsalo durante un mes.","Define the decision boundary clearly, then step back. Review outcomes, not tasks.":"Define con claridad el límite de decisión y luego da un paso atrás. Revisa resultados, no tareas.",
  "Share impact stories and data in #:#s, and explain the why when assigning work.":"Comparte historias y datos de impacto en las reuniones #:# y explica el porqué al asignar trabajo.","Protect learning time and help find a real project to apply it in.":"Protege el tiempo de aprendizaje y ayuda a encontrar un proyecto real donde aplicarlo.",
  "Three new or deeper working relationships, and a higher connection score at your next check.":"Tres relaciones de trabajo nuevas o más profundas, y un puntaje de conexión más alto en tu próxima revisión.","Set up a regular coffee or walk-and-talk with a colleague.":"Programa un café o una caminata regular para conversar con un compañero.","Join an employee group, community of practice or volunteering day.":"Únete a un grupo de colaboradores, una comunidad de práctica o una jornada de voluntariado.","Include them in team decisions and create chances to collaborate.":"Inclúyele en las decisiones del equipo y crea oportunidades para colaborar.",
  "Led at least # huddles, handovers or small projects, with written feedback from your manager.":"Haber dirigido al menos # reuniones breves, entregas de turno o proyectos pequeños, con retroalimentación escrita de tu líder.","Lead one team huddle, handover or small project each month.":"Dirige cada mes una reunión breve de equipo, una entrega de turno o un proyecto pequeño.","Ask a current leader to mentor you monthly.":"Pide a un líder actual que sea tu mentor cada mes.","Complete a first-time leader course.":"Completa un curso para nuevos líderes.","Give act-up opportunities and honest readiness feedback.":"Da oportunidades para cubrir el puesto superior y retroalimentación honesta sobre su preparación.",
  "Teammates regularly bring you questions in this area, and you have run one teach-back.":"Tus compañeros te traen preguntas de esta área con regularidad, y ya diste una sesión para enseñar lo aprendido.","Handle the hardest specialist questions on the team for a quarter.":"Atiende durante un trimestre las preguntas especializadas más difíciles del equipo.","Run a #-minute teach-back for the team.":"Da una sesión de # minutos al equipo para enseñar lo que sabes.","Pursue an advanced certification in your specialty.":"Busca una certificación avanzada en tu especialidad.","Pursue advanced training or a professional qualification.":"Busca formación avanzada o una cualificación profesional.","Make their expertise visible and send the hard questions their way.":"Haz visible su experiencia y envíale las preguntas difíciles.",
  "Three conversations held and a clear decision about the next step.":"Tres conversaciones realizadas y una decisión clara sobre el siguiente paso.","Join a cross-team project or cover in that area for a few shifts.":"Únete a un proyecto entre equipos o cubre algunos turnos en esa área.","Learn the basics of how that area works and what it looks for.":"Aprende lo básico de cómo funciona esa área y qué busca.","Broker introductions and allow time for a short rotation or shadowing.":"Facilita presentaciones y da tiempo para una rotación corta u observación.",
  "Make your current role more rewarding":"Hacer más gratificante tu puesto actual","One redesigned part of your job in place and reviewed after # weeks.":"Una parte de tu trabajo rediseñada, implementada y revisada después de # semanas.","Redesign one part of your job with your manager to add variety, ownership of a whole piece of work, or more direct feedback.":"Rediseña con tu líder una parte de tu trabajo para sumar variedad, responsabilidad sobre un trabajo completo o retroalimentación más directa.","Ask peers for one idea to improve your day-to-day.":"Pide a tus compañeros una idea para mejorar tu día a día.","Learn one skill that would make the work easier.":"Aprende una habilidad que facilite el trabajo.","Look for job-crafting options: more skill variety, a whole task they can own, visible significance and direct feedback.":"Busca opciones de rediseño del puesto: más variedad de habilidades, una tarea completa que pueda asumir, un significado visible y retroalimentación directa.",
  "Build portable skills for your next role":"Desarrollar habilidades transferibles para tu siguiente puesto","Two skills or certifications that role asks for, mastered with evidence and listed in your skills passport.":"Dos habilidades o certificaciones que pide ese puesto, dominadas con evidencia y registradas en tu pasaporte de habilidades.","Volunteer for work here that builds the skills that role asks for.":"Ofrécete para trabajos aquí que desarrollen las habilidades que pide ese puesto.","Earn one certification that employers in that field recognise.":"Obtén una certificación que reconozcan los empleadores de ese campo.",
  "Support it. The skills they build here make your team stronger while they're with you. Be honest about which next steps you can and can't offer internally.":"Apóyalo. Las habilidades que desarrolla aquí fortalecen a tu equipo mientras esté contigo. Sé honesto sobre qué siguientes pasos puedes ofrecer internamente y cuáles no.",
  "Explore what's next for you":"Explorar qué sigue para ti","A short list of # directions to test next quarter.":"Una lista corta de # direcciones para probar el próximo trimestre.","Note which tasks give you energy each week for a month.":"Durante un mes, anota cada semana qué tareas te dan energía.","Talk with # people in different roles about their path.":"Habla con # personas en distintos puestos sobre su trayectoria.","Browse internal roles and note what appeals and why.":"Revisa puestos internos y anota qué te atrae y por qué.","Help them reflect on energy and strengths, and share options you see for them.":"Ayúdale a reflexionar sobre su energía y fortalezas, y comparte opciones que ves para esa persona.",
  "Agree with your manager on what \"fully proficient\" looks like in this role and check against it at #, # and # days.":"Acuerda con tu líder cómo se ve estar \"plenamente competente\" en este puesto y compárate con eso a los #, # y # días.","Pick one result this quarter you can show with numbers.":"Elige un resultado de este trimestre que puedas mostrar con cifras.","Agree with your manager on a scope increase or a next-role conversation within # days.":"Acuerda con tu líder ampliar tu alcance o tener una conversación sobre el siguiente puesto en # días.","Mentor or teach one colleague something you know well this quarter.":"Este trimestre, sé mentor o enseña a un compañero algo que domines.",
  "Make expectations explicit, pair them with a buddy and check in more often than usual.":"Haz explícitas las expectativas, asígnale un compañero de apoyo y haz seguimiento más seguido de lo habitual.","Give stretch work with specific feedback, and start talking openly about next steps.":"Asigna trabajo retador con retroalimentación específica y empieza a hablar abiertamente de los siguientes pasos.","Watch for plateau. Discuss the next role openly and broaden their scope.":"Atento al estancamiento. Habla abiertamente del siguiente puesto y amplía su alcance.","Use their expertise to develop others and refresh their challenge. Check they still feel stretched.":"Usa su experiencia para desarrollar a otros y renueva sus retos. Verifica que siga sintiéndose desafiado.",
  "Focus on mastering the basics and building relationships before stretching wide.":"Enfócate en dominar lo básico y crear relaciones antes de abarcar más.","You know the role. Now is the time to add depth and results you can point to.":"Conoces el puesto. Ahora es momento de sumar profundidad y resultados que puedas mostrar.","You are experienced here. Growth now comes from bigger scope, new challenges or a next role.":"Tienes experiencia aquí. Ahora el crecimiento viene de un alcance mayor, nuevos retos o un siguiente puesto.","Deep experience is an asset. Keep it fresh and multiply it through others.":"La experiencia profunda es un activo. Mantenla vigente y multiplícala a través de otros.",

  "My motivation profile":"Mi perfil de motivación","Motivation profile":"Perfil de motivación","Retake":"Repetir","Why you put in effort":"Por qué te esfuerzas","Controlled":"Controlada","Autonomous":"Autónoma","Mixed":"Mixta","Disengaged":"Desconectada",
  "Amotivation":"Desmotivación","External":"Externa","Introjected":"Introyectada","Identified":"Identificada","Intrinsic":"Intrínseca","Extrinsic":"Extrínseca",
  "No clear reason to put in effort":"Sin una razón clara para esforzarse","Effort for rewards or to avoid consequences":"Esfuerzo por recompensas o para evitar consecuencias","Effort from guilt, pressure or ego":"Esfuerzo por culpa, presión u orgullo","Effort because you value the outcome":"Esfuerzo porque valoras el resultado","Effort because the work itself is enjoyable":"Esfuerzo porque el trabajo en sí es disfrutable",
  "Motivation continuum: Amotivation #, External #, Introjected #, Identified #, Intrinsic #":"Continuo de motivación: Desmotivación #, Externa #, Introyectada #, Identificada #, Intrínseca #",
  "Most of your effort comes from valuing or enjoying the work. That kind of motivation tends to last and supports well-being and learning.":"La mayor parte de tu esfuerzo viene de valorar o disfrutar el trabajo. Ese tipo de motivación suele durar y favorece el bienestar y el aprendizaje.",
  "Your effort comes from a mix of valuing the work and outside pressure or rewards. Connecting tasks to goals you care about can shift the balance.":"Tu esfuerzo viene de una mezcla entre valorar el trabajo y la presión o las recompensas externas. Conectar las tareas con metas que te importan puede cambiar el equilibrio.",
  "Much of your effort comes from rewards, pressure or obligation. That can work short-term but is harder to sustain. Your plan focuses on finding personal value in the work.":"Gran parte de tu esfuerzo viene de recompensas, presión u obligación. Puede funcionar a corto plazo, pero es más difícil de sostener. Tu plan se enfoca en encontrar valor personal en el trabajo.",
  "Right now you may not see much reason to put effort in. That's important to talk about openly with your manager. The plan starts small.":"Puede que ahora no veas muchas razones para esforzarte. Es importante hablarlo abiertamente con tu líder. El plan empieza con poco.",
  "Needs met at work":"Necesidades cubiertas en el trabajo","Competence":"Competencia","Relatedness":"Relación","All three needs are at least partly met. Keep doing what supports them.":"Las tres necesidades están al menos parcialmente cubiertas. Sigue haciendo lo que las sostiene.",

  "Offer choice in how work gets done, explain the reason behind the non-negotiables, and acknowledge their point of view.":"Ofrece opciones sobre cómo se hace el trabajo, explica la razón de lo no negociable y reconoce su punto de vista.",
  "Set clear expectations, break work into achievable steps and give informational feedback (what worked, what to try next) rather than controlling feedback.":"Fija expectativas claras, divide el trabajo en pasos alcanzables y da retroalimentación informativa (qué funcionó, qué probar después) en lugar de retroalimentación controladora.",
  "Make time to connect personally, include them in team decisions and pair them with a buddy.":"Dedica tiempo a conectar en lo personal, inclúyele en las decisiones del equipo y asígnale un compañero de apoyo.",
  "Agree on outcomes and check-in points, then stop checking the how in between.":"Acuerden resultados y puntos de revisión, y luego deja de revisar el cómo entre medio.","Explain the reason behind each rule, and invite ideas on where flexibility is safe.":"Explica la razón de cada regla e invita a proponer dónde es seguro flexibilizar.","Offer choices within the constraints: shift preferences, task order, who they partner with.":"Ofrece opciones dentro de los límites: preferencias de turno, orden de tareas, con quién trabaja.","Ask for their input before decisions, and close the loop on what you did with it.":"Pide su opinión antes de decidir y cuéntale qué hiciste con ella.",
  "Pin down the specific skill gap and arrange hands-on training or a buddy.":"Identifica la brecha de habilidad específica y organiza capacitación práctica o un compañero de apoyo.","Write down what good looks like, with real examples.":"Escribe cómo se ve un buen trabajo, con ejemplos reales.","Give short, specific feedback weekly: what worked and what to try next.":"Da retroalimentación breve y específica cada semana: qué funcionó y qué probar después.","Redesign part of the role around the strengths they named in \"How you work best\".":"Rediseña parte del puesto en torno a las fortalezas que nombró en \"Cómo trabajas mejor\".","Review workload together and remove or delay lower-value tasks.":"Revisen juntos la carga de trabajo y eliminen o pospongan tareas de menor valor.",
  "Build in regular touchpoints: shared huddles, a buddy, or a joint task each week.":"Crea puntos de contacto regulares: reuniones breves compartidas, un compañero de apoyo o una tarea conjunta cada semana.","Address the conflict directly and fairly. Set team norms for how disagreements are handled.":"Atiende el conflicto de forma directa y justa. Define normas de equipo para manejar los desacuerdos.","Assign a buddy and make introductions across the team and neighbouring teams.":"Asigna un compañero de apoyo y haz presentaciones en el equipo y en equipos cercanos.","Spend part of each 1:1 on them, not the work: interests, goals, what's going on.":"Dedica parte de cada reunión 1:1 a la persona, no al trabajo: intereses, metas, qué está pasando.","Watch who is included in conversations and decisions. Make inclusion explicit and set the tone yourself.":"Observa quién queda incluido en conversaciones y decisiones. Haz explícita la inclusión y marca tú el tono.",

  "Talents vs goals":"Talentos vs. metas","A talent is what you already do well, with evidence. A goal is what you still have to build. Keep them separate so expectations stay realistic.":"Un talento es lo que ya haces bien, con evidencia. Una meta es lo que aún tienes que construir. Mantenlos separados para que las expectativas sean realistas.",

  "Fix a root cause":"Atender una causa raíz","Stretch assignment":"Asignación retadora","Delegation":"Delegación","Meaning and impact":"Sentido e impacto","Learning time":"Tiempo de aprendizaje","Connection":"Conexión","Rewards clarity":"Claridad sobre recompensas","Act-up opportunity":"Oportunidad de cubrir el puesto superior","Clarity":"Claridad","Flexibility trial":"Prueba de flexibilidad","Use their strengths":"Usar sus fortalezas","Set up their work":"Organizar su trabajo","Career conversation":"Conversación de carrera","Feedback":"Retroalimentación",
  "This week, give one piece of specific feedback on a plan action: what worked, why, and what to try next.":"Esta semana, da una retroalimentación específica sobre una acción del plan: qué funcionó, por qué y qué probar después.",

  "Their development, their drive.":"Su desarrollo, su impulso.","Guide, support and remove barriers. Don't set their direction or their pace. Ask what they want next, then help them get it.":"Guía, apoya y quita obstáculos. No marques su dirección ni su ritmo. Pregunta qué quiere después y ayúdale a lograrlo.",
  "Support it openly. People who grow here make the team stronger while they stay, and speak well of it when they go. Be honest about what you can offer internally.":"Apóyalo abiertamente. Quienes crecen aquí fortalecen al equipo mientras están y hablan bien de él cuando se van. Sé honesto sobre lo que puedes ofrecer internamente.",
  "Wants this job to teach them:":"Quiere que este trabajo le enseñe:","Look for real work that teaches exactly that.":"Busca trabajo real que enseñe exactamente eso.",
  "Motivation quality: Autonomous.":"Calidad de la motivación: Autónoma.","Motivation quality: Mixed.":"Calidad de la motivación: Mixta.","Motivation quality: Controlled.":"Calidad de la motivación: Controlada.","Motivation quality: Disengaged.":"Calidad de la motivación: Desconectada.",
  "Protect what's working. Avoid micromanaging, and don't turn rewards into levers of control, which can crowd out motivation that comes from the work itself.":"Protege lo que funciona. Evita la microgestión y no conviertas las recompensas en palancas de control, porque pueden desplazar la motivación que viene del trabajo mismo.",
  "Help them see how tasks connect to goals they value. Explain the why behind requests so the reasons become their own.":"Ayúdale a ver cómo las tareas se conectan con metas que valora. Explica el porqué de cada pedido para que haga suyas las razones.",
  "Rewards and pressure drive most of their effort. Give a meaningful rationale for tasks, acknowledge their perspective and offer choices so they can come to value the work.":"Las recompensas y la presión impulsan la mayor parte de su esfuerzo. Da una razón con sentido para las tareas, reconoce su perspectiva y ofrece opciones para que llegue a valorar el trabajo.",
  "Talk privately and listen first. Ask what would make the work worth doing, and check workload, fit and well-being before adding goals.":"Habla en privado y escucha primero. Pregunta qué haría que el trabajo valiera la pena y revisa carga, encaje y bienestar antes de sumar metas.",
  "Leans to a fixed mindset.":"Tiende a una mentalidad fija.","Praise strategy, effort and progress rather than talent. Treat mistakes as information, not verdicts.":"Elogia la estrategia, el esfuerzo y el progreso, no el talento. Trata los errores como información, no como veredictos.",
  "Avoidance goals.":"Metas de evitación.","Frame feedback around personal progress, not comparison with others, and avoid public rankings.":"Enfoca la retroalimentación en el progreso personal, no en compararse con otros, y evita rankings públicos.",
  "Performance-approach goals.":"Metas de acercamiento al desempeño.","Visible benchmarks motivate them. Keep attention on skill growth too, so setbacks don't derail them.":"Los referentes visibles le motivan. Mantén también la atención en el crecimiento de habilidades, para que los tropiezos no le descarrilen.",
  "Low confidence to learn.":"Poca confianza para aprender.","Build self-efficacy through small successes, modelling by a similar peer, and specific encouragement.":"Construye autoeficacia con pequeños éxitos, el ejemplo de un compañero similar y ánimo específico.",
  "Doubts effort leads to performance.":"Duda que el esfuerzo lleve al desempeño.","Check for missing skills, tools or unclear standards.":"Revisa si faltan habilidades, herramientas o si hay estándares poco claros.",
  "Doesn't see performance paying off.":"No ve que el desempeño rinda frutos.","Spell out what good performance leads to here, and only promise what you control.":"Explica a qué lleva aquí un buen desempeño y promete solo lo que controlas.",
  "Sees rewards as unfair.":"Ve las recompensas como injustas.","Explain how decisions are made, listen to who they compare themselves with, and correct anything that is unfair.":"Explica cómo se toman las decisiones, escucha con quién se compara y corrige lo que sea injusto.",
  "Reward-focused right now.":"Ahora se enfoca en las recompensas.","Be concrete about how pay, promotion and recognition are decided. Present rewards as information about their progress, not as control.":"Sé concreto sobre cómo se deciden el salario, los ascensos y el reconocimiento. Presenta las recompensas como información sobre su progreso, no como control.",
  "Their talent is self-reported.":"Su talento es autodeclarado.","Give honest feedback on whether you see it too. If it's really a goal, say so kindly and help them plan for it.":"Da retroalimentación honesta sobre si tú también lo ves. Si en realidad es una meta, dilo con amabilidad y ayúdale a planificarla.",
  "Tap into their talent.":"Aprovecha su talento.","Build more of that into their assignments, and let them teach it to others.":"Incorpora más de eso en sus asignaciones y deja que lo enseñe a otros.",
  "Works best on my own.":"Trabaja mejor por su cuenta.","Works best with one partner.":"Trabaja mejor con un compañero.","Works best in a group or team.":"Trabaja mejor en grupo o en equipo.","Works best it depends on the task.":"Trabaja mejor según la tarea.",
  "Protect focused solo time and give them independent pieces of work. Don't force group work where it adds nothing.":"Protege su tiempo de concentración y dale trabajos independientes. No fuerces el trabajo en grupo donde no aporta.","Pair them deliberately on the work that matters most to them, and choose partners with care.":"Asígnale un compañero a propósito en el trabajo que más le importa y elige a esa persona con cuidado.","Put them on shared team tasks, huddles and projects. Avoid long stretches of isolated work.":"Inclúyele en tareas, reuniones breves y proyectos de equipo. Evita largos periodos de trabajo aislado.","Ask which tasks they want to do solo and which with others, and plan assignments that way.":"Pregunta qué tareas quiere hacer solo y cuáles con otros, y planifica las asignaciones así.",
  "Most productive with:":"Más productivo con:","Schedule their most important work in those conditions.":"Programa su trabajo más importante en esas condiciones.",
  "Low team identity.":"Baja identidad de equipo.","Build a shared sense of \"us\": a common team goal, team rituals, and making their contribution to the team visible.":"Construye un sentido compartido de \"nosotros\": una meta común, rituales de equipo y hacer visible su aporte al equipo.",
  "Strong team identity.":"Fuerte identidad de equipo.","They are invested in the team. Use it: give them a role in team goals, onboarding or team improvements.":"Está comprometido con el equipo. Aprovéchalo: dale un rol en las metas del equipo, la incorporación de personas nuevas o las mejoras del equipo.",
  "Protect a set amount of development time each month.":"Protege una cantidad fija de tiempo de desarrollo cada mes.","Write down what good looks like in their role and next role.":"Escribe cómo se ve un buen trabajo en su puesto actual y en el siguiente.","Give short, specific feedback weekly, not just at review time.":"Da retroalimentación breve y específica cada semana, no solo en la evaluación.","Find low-cost options or request budget for one priority item.":"Busca opciones de bajo costo o pide presupuesto para un elemento prioritario.","Start with small stretch wins and name progress when you see it.":"Empieza con pequeños logros retadores y nombra el progreso cuando lo veas.","Schedule development activities around their shifts.":"Programa las actividades de desarrollo según sus turnos.",
  "What did you get better at this month, and what felt hard?":"¿En qué mejoraste este mes y qué se sintió difícil?","Where do you want more say in how the work gets done?":"¿Dónde quieres tener más voz sobre cómo se hace el trabajo?","When did your work feel most meaningful recently?":"¿Cuándo sentiste que tu trabajo tuvo más sentido recientemente?","What have you learned recently, and where could you use it?":"¿Qué aprendiste recientemente y dónde podrías usarlo?",
  "Who at work do you feel most connected to, and who would you like to know better?":"¿Con quién te sientes más conectado en el trabajo y a quién te gustaría conocer mejor?","Do you know what it would take to reach the next pay step? What is unclear?":"¿Sabes qué se necesita para llegar al siguiente nivel salarial? ¿Qué no está claro?","What would you need to see in yourself to feel ready for the next role?":"¿Qué necesitarías ver en ti para sentirte listo para el siguiente puesto?",

  "Standard operating procedure":"Procedimiento operativo estándar","How to use Growth Compass":"Cómo usar Growth Compass","A short version of the full SOP. Turn on":"Una versión breve del procedimiento completo. Activa","(top right) to follow along with a team already using the app.":"(arriba a la derecha) para seguirla con un equipo que ya usa la app.",
  "For employees":"Para colaboradores","For managers":"Para líderes","Own it.":"Hazlo tuyo.","Your development is personal. You decide what to work on and how fast; your manager guides and supports. Skills you build are yours to keep, here or at your next employer.":"Tu desarrollo es personal. Tú decides en qué trabajar y a qué ritmo; tu líder guía y apoya. Las habilidades que desarrollas son tuyas, aquí o con tu próximo empleador.",
  "Take the assessment.":"Haz la evaluación.","Open":"Abre","and select":"y selecciona",". It has # short steps and takes about # minutes. Answer for how things are now, not how they should be.":". Tiene # pasos cortos y toma unos # minutos. Responde según cómo son las cosas ahora, no cómo deberían ser.",
  "Read your profile.":"Lee tu perfil.","Your profile shows why you put in effort, which needs your job meets (and what's behind any gaps), how you work best, which rewards matter and what you believe about growing.":"Tu perfil muestra por qué te esfuerzas, qué necesidades cubre tu trabajo (y qué hay detrás de cada brecha), cómo trabajas mejor, qué recompensas importan y qué crees sobre crecer.",
  "Know your talents from your goals.":"Distingue tus talentos de tus metas.","A talent is something you already do well, with evidence others would agree with. A goal is something you still have to build. Each goal gets an honest verdict (Realistic, Stretch, Unlikely in # days, Not fully in your control), and the plan tells you if it's bigger than the time you have.":"Un talento es algo que ya haces bien, con evidencia con la que otros estarían de acuerdo. Una meta es algo que aún tienes que construir. Cada meta recibe un veredicto honesto (Realista, Expandir, Poco probable en # días, No depende solo de ti), y el plan te dice si es más grande que el tiempo que tienes.",
  "Own your skills and certifications.":"Haz tuyas tus habilidades y certificaciones.","In":"En",", pick what to work towards next (suggestions are for your role type), move each item through its stages and log practice. Ask your manager for support (time, a real task, feedback, funding, a mentor or sign-off) whenever you need it.":", elige en qué trabajar después (las sugerencias son para tu tipo de puesto), avanza cada elemento por sus etapas y registra tu práctica. Pide apoyo a tu líder (tiempo, una tarea real, retroalimentación, financiamiento, un mentor o una validación) cuando lo necesites.",
  "Skills and certifications":"Habilidades y certificaciones","Agree your plan.":"Acuerda tu plan.","Within # weeks, go through your plan with your manager. Edit actions, add your own and remove what doesn't fit. Each goal shows what success looks like and what to ask of your manager.":"En # semanas, revisa tu plan con tu líder. Edita acciones, agrega las tuyas y quita lo que no encaje. Cada meta muestra cómo se ve el éxito y qué pedirle a tu líder.",
  "Work the plan.":"Trabaja el plan.","Tick actions off as you go. Most of your growth comes from the # actions: practice in your real work.":"Marca las acciones a medida que avanzas. La mayor parte de tu crecimiento viene de las acciones #: práctica en tu trabajo real.",
  "Check in monthly.":"Haz un seguimiento mensual.","Once a month, add a check-in: energy, productivity, wins, where you used something new, what made the difference and what you need.":"Una vez al mes, agrega un seguimiento: energía, productividad, logros, dónde usaste algo nuevo, qué marcó la diferencia y qué necesitas.",
  "Retake every # days.":"Repite la evaluación cada # días.","Select":"Selecciona","on your profile. You get a new plan, and your previous results are kept in your history.":"en tu perfil. Obtienes un plan nuevo y tus resultados anteriores se guardan en tu historial.",

  "Prepare each #:#.":"Prepara cada reunión #:#.","Select a person to open their coaching playbook: what's behind any low needs, how to tap into their talent, how they work best and questions to ask. Tags show which research each tip comes from.":"Selecciona a una persona para abrir su guía de acompañamiento: qué hay detrás de las necesidades bajas, cómo aprovechar su talento, cómo trabaja mejor y qué preguntar. Las etiquetas muestran de qué investigación viene cada consejo.",
  "Be straight about expectations.":"Sé claro con las expectativas.","Use the":"Usa la tarjeta","card and each goal's verdict. Confirm or challenge self-reported talents. Never promise pay or promotion you don't control. Help people cut plans that don't fit their time.":"y el veredicto de cada meta. Confirma o cuestiona los talentos autodeclarados. Nunca prometas salario o ascensos que no controlas. Ayuda a recortar los planes que no caben en el tiempo disponible.",

// ---------- Scoring ----------
function profileOf(a){
  const why = a.why || {}, nd = a.needs || {}, b = a.beliefs || {}, r = a.ratings || {};
  const reg = Object.fromEntries(REGS.map(g => [g.k, avg(WHY.filter(w => w.reg === g.k).map(w => why[w.k]))]));
  const rai = REGS.filter(g => g.w).reduce((s, g) => s + g.w * (reg[g.k] || 0), 0);
  const quality = (reg.amotivation || 0) >= 4 ? {k:"amotivated", label:"Disengaged", cls:"crit"}
    : rai >= 3 ? {k:"autonomous", label:"Autonomous", cls:"ok"} : rai <= -1 ? {k:"controlled", label:"Controlled", cls:"warn"} : {k:"mixed", label:"Mixed", cls:"neutral"};
  const needs = Object.fromEntries(NEEDS.map(n => [n.k, nd[n.k + "_s"] && nd[n.k + "_f"] ? (nd[n.k + "_s"] + 6 - nd[n.k + "_f"]) / 2 : null]));
  const mindsetV = b.fixed && b.growth ? (b.growth + 6 - b.fixed) / 2 : null;
  const mindset = mindsetV == null ? null : mindsetV >= 3.5 ? "Growth" : mindsetV <= 2.5 ? "Fixed" : "Mixed";
  const pct = v => v ? Math.round((v - 1) / 4 * 100) : 0;
  const inPct = pct(avg(DRIVERS.filter(d => d.type === "in").map(d => r[d.key])));
  const exPct = pct(avg(DRIVERS.filter(d => d.type === "ex").map(d => r[d.key])));
  const st = a.style || {};
  const identity = avg([st.id1, st.id2]);
  return {reg, rai: Math.round(rai * 10) / 10, quality, needs, mindset, mindsetV, b, inPct, exPct, identity};
}
const needLow = v => v != null && v <= 2.5;
// Need → what it's related to → what to do about it
function needsMap(a){
  const P = profileOf(a);
  return NEEDS.map(n => { const v = P.needs[n.k]; const s = needLow(v) ? n.src[a.needSrc?.[n.k]] : null;
    return {n, v, low: needLow(v), source: s?.label || "", fix: s ? s.fix : needLow(v) ? n.mgr : ""}; });
}
function qualityText(q){

    mixed: "Your effort comes from a mix of valuing the work and outside pressure or rewards. Connecting tasks to goals you care about can shift the balance.",
    controlled: "Much of your effort comes from rewards, pressure or obligation. That can work short-term but is harder to sustain. Your plan focuses on finding personal value in the work.",
    amotivated: "Right now you may not see much reason to put effort in. That's important to talk about openly with your manager. The plan starts small."
  }[q.k];
}
function rewardText(p){
  if (p.inPct - p.exPct >= 15) return "Growth, meaning and ownership matter more to you than incentives right now.";
  if (p.exPct - p.inPct >= 15) return "Tangible rewards (pay, title, recognition, stability) matter most right now. Your plan makes the path to them explicit.";
  return "Both the work itself and its rewards matter to you.";
}

// ---------- Plan generation ----------
function makePlan(a){
  const t = a.track, P = profileOf(a);
  const goals = a.top.map((k, i) => {
    const d = DMAP[k]; const f = optsFor(d, t)[a.deep?.[k] ?? 0];
    return {id: uid(), driver: k, title: d.goal(f), measure: d.measure(f), due: addDays(30 * (i + 1)), status: "Not started", support: d.mgr(f),
      actions: [{id: uid(), type: "70", text: d.a70(f, t), done: false}, {id: uid(), type: "20", text: d.a20(f, t), done: false}, {id: uid(), type: "10", text: d.a10(f, t), done: false}]};
  });
  // Foundation goal: only when needs are frustrated or beliefs could block growth
  const fuel = [];
  NEEDS.forEach(n => { if (needLow(P.needs[n.k])) fuel.push(n.act); });
  if ((P.b.efficacy || 5) <= 2 && !fuel.some(x => x === NEEDS[1].act)) fuel.push(NEEDS[1].act);
  if ((P.b.efficacy || 5) <= 2) fuel.push({type:"20", text:"Watch a peer at a similar level handle something you find hard, then try it yourself the same week."});
  if (P.mindset === "Fixed") fuel.push({type:"70", text:"Keep a weekly \"mistake → lesson\" note: one thing that went wrong and what you'll try next time."});
  if (a.goalO === "pav" || a.goalO === "mav") fuel.push({type:"10", text:"Each month, compare your work with your own work last month, not with other people's."});
  fuel.splice(3);
  if (fuel.length) goals.unshift({id: uid(), driver: "fuel", title: "Build the confidence and conditions to grow", measure: "Your needs and confidence scores improve when you retake the assessment in 90 days.",
    due: addDays(45), status: "Not started", support: "Start with small wins and informational feedback. Ask about what's getting in the way before adding stretch.",
    actions: fuel.map(x => ({id: uid(), ...x, done: false}))});
  // Strengths goal: built from what the person said about their own talents and best conditions
  const st = a.style || {};
  const talent = (st.talent || "").trim(), flow = (st.flow || "").trim();
  const conds = (st.conds || []).map(k => CONDS[k]?.toLowerCase()).filter(Boolean);
  if (talent || flow){
    const acts = [];
    if (talent) acts.push({type:"70", text:`Agree with your manager on one way to use "${talent}" more in your regular work.`});
    if (flow) acts.push({type:"70", text:`Find ways to do more of the work where you lose track of time ("${flow}"), and note how it affects your output.`});
    if (conds.length) acts.push({type:"70", text:`Set up at least one block each week with your best conditions: ${conds.slice(0, 3).join(", ")}.`});
    acts.push({type:"20", text: st.mode === "alone" ? "Share one thing you're good at with a colleague in a short one-to-one walkthrough." : "Teach or support a teammate using your strength."});
    goals.push({id: uid(), driver: "talent", title: "Use your strengths more, in the way you work best", measure: "More of your week goes to work that uses your strengths, and your productivity rating rises at check-ins.",
      due: addDays(60), status: "Not started", support: `Build their strengths into their assignments.${MODES[st.mode] ? " " + MODES[st.mode].mgr : ""}`,
      actions: acts.map(x => ({id: uid(), ...x, done: false}))});
  }
  const dir = DIRS[a.direction];
  if (dir){
    const det = (a.dirDetail || "").trim(); const ten = TENURE[a.tenure];
    const acts = [{type:"70", text: dir.a70(det, t)}, {type:"20", text: dir.a20(det, t)}, {type:"10", text: dir.a10(det, t)}];
    if (ten) acts.splice(1, 0, {type:"70", text: ten.extra});
    goals.push({id: uid(), driver: "career", title: dir.goal(det), measure: dir.measure(det), due: addDays(90), status: "Not started",
      support: dir.mgr + (ten ? " " + ten.mgr : ""), actions: acts.map(x => ({id: uid(), ...x, done: false}))});
  }
  // Size the plan to the time the person said they have: goals that don't fit are parked, not hidden
  const feasible = Math.max(1, Math.floor(capacityHours(a) / HOURS_PER_ACTION));
  let used = 0;
  goals.forEach((g, i) => { const n = g.actions.length; if (i > 0 && used + n > feasible) g.status = "Later"; else used += n; });
  return {createdAt: todayISO(), goals};
}
// ---------- Reality check: honest feasibility, no sugar-coating ----------
const HOURS_90 = [4.5, 12, 24];     // development hours over 90 days for each HOURS option
const HOURS_PER_ACTION = 2;
const capacityHours = a => HOURS_90[a.hours ?? 1] + OWN_90[a.ownHours ?? 0];
const timeText = a => HOURS[a.hours ?? 1].toLowerCase() + " of work time" + ((a.ownHours ?? 0) ? ` plus ${OWN[a.ownHours].toLowerCase()} of your own` : "");         // rough guide, stated to the user
const VERDICT = {parked:{label:"Parked for later", cls:"neutral"}, ok:{label:"Realistic", cls:"ok"}, stretch:{label:"Stretch", cls:"warn"}, unlikely:{label:"Unlikely in 90 days", cls:"crit"}, outside:{label:"Not fully in your control", cls:"neutral"}};
function realityCheck(doc){
  const a = doc.assessment || {}, goals = doc.plan?.goals || [];
  const hours = capacityHours(a); const feasible = Math.max(1, Math.floor(hours / HOURS_PER_ACTION));
  const open = goals.filter(g => g.status !== "Later").reduce((n, g) => n + (g.actions || []).filter(x => !x.done).length, 0);
  let used = 0; const verdicts = {};
  goals.forEach(g => {
    if (g.status === "Later"){ verdicts[g.id] = {level:"parked", text:"Not in these 90 days. There isn't time for it alongside the goals above. Bring it back when one is done, or agree more development time first."}; return; }
    const left = (g.actions || []).filter(x => !x.done).length;
    let v = {level:"ok", text:"Within your control and sized for 90 days, if you do the actions."};
    if (g.driver === "mastery") v = {level:"ok", text:"Realistic progress in 90 days. Real mastery takes months of repeated practice; one course won't do it."};
    if (g.driver === "growth") v = {level:"ok", text:"Realistic to start and apply in 90 days. Certifications usually take weeks to months of study; check the official exam guide."};
    if (g.driver === "pay") v = {level:"outside", text:"Pay depends on the company's pay process and budget, not only on you. This goal builds your case. It does not guarantee a rise."};
    if (g.driver === "promotion") v = a.tenure === "lt1"
      ? {level:"unlikely", text:"With less than a year in role, a promotion in 90 days is unlikely. Most organisations want a track record first. Realistic target: ready to act up within 12 months."}
      : {level:"outside", text:"Promotion depends on an opening and on other people's decisions. This goal makes you ready. It cannot guarantee the role."};
    if (g.driver === "recognition") v = {level:"outside", text:"You control making your work visible. You don't control how others respond."};
    if (g.driver === "flex") v = {level:"outside", text:"Depends on business needs and policy. A trial is realistic. A guaranteed arrangement is not."};
    if (g.driver === "career" && a.direction === "up"){
      if (a.dirDetail === "Within 6 months" && a.tenure === "lt1") v = {level:"unlikely", text:"Going from new in role to leading others in 6 months is unlikely. A realistic timeline is 12 to 24 months."};
      else if (a.dirDetail === "Within 6 months") v = {level:"stretch", text:"Possible only with consistent effort and an opening. Plan for 12 months and treat 6 as a bonus."};
      else v = {level:"ok", text:"A realistic timeline, if you build a track record of leading small things now."};
    }
    if (left && used + left > feasible && used >= feasible) v = {level:"unlikely", text:`Won't fit. With ${timeText(a)} you have time for about ${feasible} actions in 90 days, and earlier goals use them up. Drop this goal for now or free up more time.`};
    else if (left && used + left > feasible) v = {level: v.level === "ok" ? "stretch" : v.level, text: v.text + ` Only part of this fits the time you have.`};
    used += left; verdicts[g.id] = v;
  });
  return {hours, feasible, open, over: open > feasible, verdicts};
}
function talentStatus(st){
  if (!st?.talent) return null;
  return (st.talentProof || "").trim() ? {cls:"ok", label:"Confirmed", text: st.talentProof} : {cls:"warn", label:"Self-reported", text:"Not yet confirmed. Ask a colleague or your manager whether they'd agree."};
}
function planProgress(p){
  const acts = (p?.goals || []).filter(g => g.status !== "Later").flatMap(g => g.actions || []);
  return acts.length ? Math.round(acts.filter(a => a.done).length / acts.length * 100) : 0;
}
function statusFor(doc, empId){
  const a = doc?.assessment;
  if (!a?.completedAt) return {cls:"none", text:"Assessment not started"};
  const P = profileOf(a);
  const last = (doc.checkins || [])[0]?.date || a.completedAt;
  const prog = planProgress(doc.plan);
  const stalled = prog < 20 && daysSince(doc.plan?.createdAt) > 30;
  const overdue = daysSince(last) > 35;
  const longTenure = a.tenure === "y3_5" || a.tenure === "y5";
  const lowEnergy = (doc.checkins || [])[0]?.energy <= 2;
  if (P.quality.k === "amotivated") return {cls:"crit", text:"Disengagement risk"};
  if ((stalled || lowEnergy) && longTenure) return {cls:"crit", text:"Retention risk"};
  if (lowEnergy) return {cls:"crit", text:"Low energy at last check-in"};
  if ((P.b.equity || 5) <= 2) return {cls:"warn", text:"Fairness concern"};
  if (stalled) return {cls:"warn", text:"Plan stalled"};
  if (empId && skillStats(doc, empId).open) return {cls:"warn", text:"Support ask waiting"};
  if (overdue) return {cls:"warn", text:"Check-in overdue"};
  return {cls:"ok", text:"On track"};
}
function playbook(a){

  if (a.learnAgenda) out.push(["HL", `<b>Wants this job to teach them:</b> "${esc(a.learnAgenda)}". Look for real work that teaches exactly that.`]);

  const q = {
    autonomous: "Protect what's working. Avoid micromanaging, and don't turn rewards into levers of control, which can crowd out motivation that comes from the work itself.",
    mixed: "Help them see how tasks connect to goals they value. Explain the why behind requests so the reasons become their own.",
    controlled: "Rewards and pressure drive most of their effort. Give a meaningful rationale for tasks, acknowledge their perspective and offer choices so they can come to value the work.",

  }[P.quality.k];

  const st = a.style || {};
  const tsm = talentStatus(st);
  if (tsm && tsm.cls === "warn") out.push(["APTM", "<b>Their talent is self-reported.</b> Give honest feedback on whether you see it too. If it's really a goal, say so kindly and help them plan for it."]);

  if (MODES[st.mode]) out.push(["SDT", `<b>Works best ${esc(MODES[st.mode].label.toLowerCase())}.</b> ${esc(MODES[st.mode].mgr)}`]);
  if ((st.conds || []).length) out.push(["PAW", `<b>Most productive with:</b> ${esc(st.conds.map(k => CONDS[k]).filter(Boolean).join(", ").toLowerCase())}${st.peak != null ? `, ${esc(PEAK[st.peak].toLowerCase())}` : ""}. Schedule their most important work in those conditions.`]);
  if (P.identity != null && P.identity <= 2.5) out.push(["SDT", "<b>Low team identity.</b> Build a shared sense of \"us\": a common team goal, team rituals, and making their contribution to the team visible."]);
  else if (P.identity != null && P.identity >= 4) out.push(["SDT", "<b>Strong team identity.</b> They are invested in the team. Use it: give them a role in team goals, onboarding or team improvements."]);
  if (P.mindset === "Fixed") out.push(["HCM", "<b>Leans to a fixed mindset.</b> Praise strategy, effort and progress rather than talent. Treat mistakes as information, not verdicts."]);

  if (a.goalO === "papp") out.push(["HCM", "<b>Performance-approach goals.</b> Visible benchmarks motivate them. Keep attention on skill growth too, so setbacks don't derail them."]);
  if ((P.b.efficacy || 5) <= 2) out.push(["HL", "<b>Low confidence to learn.</b> Build self-efficacy through small successes, modelling by a similar peer, and specific encouragement."]);
  if ((P.b.expectancy || 5) <= 2) out.push(["PAW", "<b>Doubts effort leads to performance.</b> Check for missing skills, tools or unclear standards."]);
  if ((P.b.instrumentality || 5) <= 2) out.push(["PAW", "<b>Doesn't see performance paying off.</b> Spell out what good performance leads to here, and only promise what you control."]);
  if ((P.b.equity || 5) <= 2) out.push(["PAW", "<b>Sees rewards as unfair.</b> Explain how decisions are made, listen to who they compare themselves with, and correct anything that is unfair."]);
  if (P.exPct - P.inPct >= 15) out.push(["SDT", "<b>Reward-focused right now.</b> Be concrete about how pay, promotion and recognition are decided. Present rewards as information about their progress, not as control."]);
  (a.blockers || []).forEach(k => out.push(["APTM", `<b>Blocker: ${esc(BLOCKERS[k].label.toLowerCase())}.</b> ${esc(BLOCKERS[k].mgr)}`]));
  return out;
}

let pendingRender = false;
function render(force){
  const ae = document.activeElement;
  if (!force && ae && $("#app").contains(ae) && ae.matches("textarea, input[type=text]")) { pendingRender = true; return; }
  pendingRender = false;
  if (!render.header) render.header = $(".bar").innerHTML;
  if (render.lang !== LANG){ $(".bar").innerHTML = render.header; translateDom($(".bar")); render.lang = LANG; document.documentElement.lang = LANG; }
  document.querySelectorAll("[data-action=lang]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.l === LANG)));
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", String(t.dataset.v === S.view)));
  $("#demo-tog").setAttribute("aria-pressed", String(S.demo));
  $("#app").innerHTML = S.view === "me" ? renderMe() : S.view === "team" ? renderTeam() : S.view === "guide" ? renderGuide() : S.view === "blueprint" ? renderBlueprint() : renderFoundations();
  translateDom($("#app"));
}
document.addEventListener("focusin", e => { if (e.target.dataset?.pick) e.target.dispatchEvent(new Event("input", {bubbles: true})); });
document.addEventListener("focusout", () => setTimeout(() => { if (pendingRender) render(); }, 0));

function banner(){
  if (S.demo) return "";
  if (!S.live) return `<div class="notice"><b>Saved on this device only.</b> Your answers stay in this browser. When the app is shared through claude.ai, plans are shared with your manager and team.</div>`;
  if (S.readOnly) return `<div class="notice"><b>View only.</b> You can read plans here but not save. Ask the page owner for Contributor access.</div>`;
  return "";
}

}

const scale = (group, k, val, label, lo = "Strongly disagree", hi = "Strongly agree") => `<div class="q"><b>${esc(label)}</b>
  <div class="scale" role="radiogroup" aria-label="${esc(label)}">${[1,2,3,4,5].map(n => `<label><input type="radio" name="${group}-${k}" value="${n}" data-action="rate" data-g="${group}" data-k="${k}" ${val === n ? "checked" : ""}><span>${n}</span></label>`).join("")}</div>
  <div class="scale-legend"><span>${lo}</span><span>${hi}</span></div></div>`;

function renderAssessment(){
  const A = S.assess, st = A.step;
  const steps = `<div class="steps" aria-label="Progress">${STEPS.map((s, i) => `<div class="step ${i < st ? "done" : i === st ? "cur" : ""}"><i></i>${esc(s)}</div>`).join("")}</div>`;
  let body = "", canNext = true;
  if (st === 0){
    body = `<h2>About you</h2><p class="muted">This first branch tailors the questions and plan to your kind of work and your stage in the role.</p>
      <div class="q"><b>What kind of role do you have?</b><div class="opts">${Object.entries(TRACKS).map(([k, t]) => `<label class="opt"><input type="radio" name="track" value="${k}" data-action="set" data-f="track" ${A.track === k ? "checked" : ""}><span><b>${t.label}</b><small>${t.hint}</small></span></label>`).join("")}</div></div>
      <div class="q"><b>How long have you been in your current role?</b><div class="opts">${Object.entries(TENURE).map(([k, t]) => `<label class="opt"><input type="radio" name="tenure" value="${k}" data-action="set" data-f="tenure" ${A.tenure === k ? "checked" : ""}><span><b>${t.label}</b><small>${t.stage} stage</small></span></label>`).join("")}</div></div>
      <div class="q field"><label for="job-title">Job title <span class="muted">(optional)</span></label><input type="text" id="job-title" data-input="title" value="${esc(A.title || "")}" placeholder="e.g. Maintenance technician"></div>`;
    canNext = A.track && A.tenure;
  } else if (st === 1){
    body = `<h2>Why do you put effort into your job?</h2><p class="muted">Rate how true each reason is for you. Most people have several reasons at once. Answer honestly; nobody is graded on this.</p>
      ${WHY.map(w => scale("why", w.k, A.why[w.k], w.text, "Not at all true", "Completely true")).join("")}`;
    canNext = WHY.every(w => A.why[w.k]);
  } else if (st === ST.needs){
    const lows = NEEDS.filter(n => A.needs[n.k + "_s"] && A.needs[n.k + "_f"] && needLow((A.needs[n.k + "_s"] + 6 - A.needs[n.k + "_f"]) / 2));
    body = `<h2>How does your job feel day to day?</h2><p class="muted">These cover three needs everyone has at work: having a say, feeling capable, and feeling connected. If one comes out low, we'll ask what it's related to so it can be fixed at the source.</p>
      ${NEEDS.map(n => `${scale("needs", n.k + "_s", A.needs[n.k + "_s"], n.s)}${scale("needs", n.k + "_f", A.needs[n.k + "_f"], n.f)}
        ${lows.includes(n) ? `<div class="branch" style="margin-bottom:12px"><span class="chip warn" style="justify-self:start">${esc(n.label)} looks low</span><b>${esc(n.q)}</b>
          <div class="opts">${Object.entries(n.src).map(([k, s]) => `<label class="opt"><input type="radio" name="src-${n.k}" value="${k}" data-action="needsrc" data-k="${n.k}" ${A.needSrc[n.k] === k ? "checked" : ""}><span>${esc(s.label)}</span></label>`).join("")}</div></div>` : ""}`).join("")}`;
    canNext = NEEDS.every(n => A.needs[n.k + "_s"] && A.needs[n.k + "_f"]) && lows.every(n => A.needSrc[n.k]);
  } else if (st === ST.style){
    const s = A.style;
    body = `<h2>How do you work best?</h2><p class="muted">Only you know this. Your answers go straight into your plan and into how your manager sets up your work.</p>
      <div class="q"><b>Where do you do your best work?</b><div class="opts">${Object.entries(MODES).map(([k, m]) => `<label class="opt"><input type="radio" name="mode" value="${k}" data-action="style" data-k="mode" ${s.mode === k ? "checked" : ""}><span><b>${esc(m.label)}</b><small>${esc(m.sub)}</small></span></label>`).join("")}</div></div>
      ${scale("style", "id1", s.id1, "Being part of my team is an important part of who I am at work")}
      ${scale("style", "id2", s.id2, "When someone praises my team, it feels like praise for me too")}
      <div class="q"><b>What helps you be most productive?</b> <span class="muted">Pick up to 4.</span><div class="opts">${Object.entries(CONDS).map(([k, l]) => `<label class="opt"><input type="checkbox" value="${k}" data-action="cond" ${s.conds.includes(k) ? "checked" : ""}><span>${esc(l)}</span></label>`).join("")}</div></div>
      <div class="q"><b>When are you at your sharpest?</b><div class="opts">${PEAK.map((p, i) => `<label class="opt"><input type="radio" name="peak" value="${i}" data-action="style" data-k="peak" ${s.peak === i ? "checked" : ""}><span>${esc(p)}</span></label>`).join("")}</div></div>
      <div class="q field"><label for="st-best">Think of a time you were at your most productive. What were you doing, and what made it work?</label><textarea id="st-best" data-sinput="best" placeholder="In your own words">${esc(s.best || "")}</textarea></div>
      <div class="q"><div class="support"><b>Talent or goal? Be honest here.</b> A <b>talent</b> is something you already do well, again and again, that others notice and rely on. A <b>goal</b> is something you can't do yet, or not well enough, and will have to work for. Listing a goal as a talent sets you up for disappointment. Goals come later in the assessment.</div></div>
      <div class="q field"><label for="st-talent">What do colleagues come to you for? (a talent)</label><input type="text" id="st-talent" data-sinput="talent" value="${esc(s.talent || "")}" placeholder="e.g. calming upset customers, fixing the label printer"></div>
      <div class="q field"><label for="st-proof">How do you know it's a talent? Who has told you, or what results show it?</label><input type="text" id="st-proof" data-sinput="talentProof" value="${esc(s.talentProof || "")}" placeholder="e.g. my lead sends the hard calls to me; zero repeat faults on my jobs"><span class="small muted">If you can't answer this, it may be a goal rather than a talent. That's fine, but it will be labelled as self-reported until someone confirms it.</span></div>
      <div class="q field"><label for="st-flow">Which part of your work makes you lose track of time?</label><input type="text" id="st-flow" data-sinput="flow" value="${esc(s.flow || "")}"><span class="small muted">Enjoying something is a strong signal of where to grow. It is not proof that you're already good at it.</span></div>`;
    canNext = s.mode && s.id1 && s.id2;
  } else if (st === ST.rewards){
    body = `<h2>Which rewards matter to you right now?</h2><p class="muted">Rate how much each would motivate you over the next year.</p>
      ${A.order.map(k => scale("ratings", k, A.ratings[k], DMAP[k].stmt, "Not important", "Essential")).join("")}`;
    canNext = DRIVERS.every(d => A.ratings[d.key]);
  } else if (st === ST.top){
    const sorted = [...DRIVERS].sort((a, b) => (A.ratings[b.key] || 0) - (A.ratings[a.key] || 0));
    body = `<h2>Pick your top 3</h2><p class="muted">We pre-selected your highest ratings. Change them if something else matters more today. Each one becomes a goal. <b class="mono">${A.top.length}/3</b></p>
      <div class="opts">${sorted.map(d => `<label class="opt"><input type="checkbox" value="${d.key}" data-action="top" ${A.top.includes(d.key) ? "checked" : ""}><span><span class="row" style="gap:8px"><span class="dot ${d.type}"></span><b>${esc(d.label)}</b><span class="mono muted" style="margin-left:auto">${A.ratings[d.key]}/5</span></span><small>${esc(d.stmt)}</small></span></label>`).join("")}</div>
      <p class="muted small" style="margin-top:10px"><span class="dot in"></span> intrinsic &nbsp; <span class="dot ex"></span> extrinsic</p>`;
    canNext = A.top.length === 3;
  } else if (st === ST.deep){
    body = `<h2>Go deeper on your top 3</h2><p class="muted">Each driver opens its own branch. Options are tailored for ${esc(TRACKS[A.track].label.toLowerCase())} roles.</p>
      ${A.top.map(k => { const d = DMAP[k]; return `<div class="q"><span class="chip ${d.type}" style="justify-self:start">${esc(d.label)}</span><div class="branch"><b>${esc(d.q)}</b><div class="opts">${optsFor(d, A.track).map((o, i) => `<label class="opt"><input type="radio" name="deep-${k}" value="${i}" data-action="deep" data-k="${k}" ${A.deep[k] === i ? "checked" : ""}><span>${esc(o[0].toUpperCase() + o.slice(1))}</span></label>`).join("")}</div></div></div>`; }).join("")}`;
    canNext = A.top.every(k => A.deep[k] !== undefined);
  } else if (st === ST.beliefs){
    body = `<h2>What do you believe about growing at work?</h2><p class="muted">Beliefs shape how people respond to challenge and feedback. Your answers change how your plan and your manager's coaching are framed.</p>
      ${BELIEFS.map(b => scale("beliefs", b.k, A.beliefs[b.k], b.text)).join("")}
      <div class="q"><b>At work, what are you mostly trying to do?</b><div class="opts">${Object.entries(GOALO).map(([k, g]) => `<label class="opt"><input type="radio" name="goalO" value="${k}" data-action="set" data-f="goalO" ${A.goalO === k ? "checked" : ""}><span>${esc(g.label)}</span></label>`).join("")}</div></div>`;
    canNext = BELIEFS.every(b => A.beliefs[b.k]) && A.goalO;
  } else if (st === ST.dir){
    const dir = DIRS[A.direction]; const ten = TENURE[A.tenure];
    body = `<h2>Where do you want your career to go?</h2><p class="muted">You are in the <b>${esc(ten.stage)}</b> stage (${esc(ten.label.toLowerCase())} in role). ${esc(ten.note)}</p>
      <div class="q"><div class="opts">${Object.entries(DIRS).map(([k, d]) => `<label class="opt"><input type="radio" name="dir" value="${k}" data-action="set" data-f="direction" ${A.direction === k ? "checked" : ""}><span><b>${esc(d.label)}</b><small>${esc(d.sub)}</small></span></label>`).join("")}</div></div>
      ${dir?.follow ? `<div class="branch">${dir.follow.kind === "choice"
        ? `<b>${esc(dir.follow.q)}</b><div class="opts">${dir.follow.opts.map(o => `<label class="opt"><input type="radio" name="dirdet" value="${esc(o)}" data-action="set" data-f="dirDetail" ${A.dirDetail === o ? "checked" : ""}><span>${esc(o)}</span></label>`).join("")}</div>${A.tenure === "lt1" && A.direction === "up" ? `<p class="muted small">You are new in role, so we'll add steps to build a strong track record first.</p>` : ""}`
        : `<div class="field"><label for="dir-detail">${esc(dir.follow.q)}</label><input type="text" id="dir-detail" data-input="dirDetail" value="${esc(A.dirDetail || "")}"></div>`}</div>` : ""}`;
    body += `<p class="small muted">Your manager can see your direction. Growth Compass treats a move to another company as a normal career step. The skills you build go with you.</p>
      <div class="q field"><label for="learn-agenda">Besides pay, what do you want this job to teach you?</label><input type="text" id="learn-agenda" data-input="learnAgenda" value="${esc(A.learnAgenda || "")}" placeholder="e.g. how to lead a shift, how to read a P&L, PLC programming"><span class="small muted">Every job is also a place to learn. Skills stay with you wherever you go next.</span></div>`;
    canNext = !!A.direction;
  } else if (st === ST.practical){
    body = `<h2>Make it practical</h2>
      <div class="q"><b>What usually gets in the way of your development?</b> <span class="muted">Pick any.</span><div class="opts">${Object.entries(BLOCKERS).map(([k, b]) => `<label class="opt"><input type="checkbox" value="${k}" data-action="blocker" ${A.blockers.includes(k) ? "checked" : ""}><span>${esc(b.label)}</span></label>`).join("")}</div></div>
      <div class="q"><b>How much work time can you realistically give to development?</b><div class="opts">${HOURS.map((h, i) => `<label class="opt"><input type="radio" name="hours" value="${i}" data-action="hours" ${A.hours === i ? "checked" : ""}><span>${esc(h)}</span></label>`).join("")}</div></div>`;
    body += `<div class="q"><b>How much of your own time will you invest each month? <span class="muted">(optional)</span></b>
      <p class="small muted">Your development is yours. Employers can offer work time, but people who move fastest usually invest some of their own too. There is no wrong answer; your plan is sized to what you choose.</p>
      <div class="opts">${OWN.map((h, i) => `<label class="opt"><input type="radio" name="own" value="${i}" data-action="own" ${(A.ownHours ?? 0) === i ? "checked" : ""}><span>${esc(h)}</span></label>`).join("")}</div></div>`;
    canNext = A.hours !== undefined;
  }
  return `<section class="card stack" style="gap:16px">${steps}<div class="stack" style="gap:6px">${body}</div>
    <div class="nav"><button class="btn ghost" data-action="${st === 0 ? "cancel" : "back"}">${st === 0 ? "Cancel" : "Back"}</button>
    <button class="btn" data-action="next" ${canNext ? "" : "disabled"}>${st === STEPS.length - 1 ? "See my results and plan" : "Next"}</button></div></section>`;
}

function renderProfile(doc, mine){
  const a = doc.assessment; const P = profileOf(a);
  const sorted = [...DRIVERS].sort((x, y) => (a.ratings[y.key] || 0) - (a.ratings[x.key] || 0));
  const dir = DIRS[a.direction]; const ten = TENURE[a.tenure];
  const regColor = k => k === "amotivation" ? "var(--crit)" : k === "external" || k === "introjected" ? "var(--ex)" : "var(--in)";
  return `<section class="card stack" style="gap:14px">
    <div class="row between"><h2>${mine ? "My motivation profile" : "Motivation profile"}</h2>${mine && !S.demo ? `<button class="btn ghost sm" data-action="retake">Retake</button>` : ""}</div>

    <div class="stack" style="gap:8px">
      <div class="row between"><b>Why you put in effort ${src("SDT")}</b><span class="chip ${P.quality.cls}">${esc(P.quality.label)} · <span class="mono">${P.rai > 0 ? "+" : ""}${P.rai}</span></span></div>
      <div class="continuum" role="img" aria-label="Motivation continuum: ${REGS.map(g => `${g.label} ${P.reg[g.k]?.toFixed(1)}`).join(", ")}">
        ${REGS.map(g => `<div class="col" title="${esc(g.desc)}"><span class="mono">${(P.reg[g.k] || 0).toFixed(1)}</span><div class="bx"><b style="height:${(P.reg[g.k] || 0) / 5 * 100}%;background:${regColor(g.k)}"></b></div><span>${esc(g.label)}</span></div>`).join("")}
      </div>
      <div class="continuum-axis"><span>Controlled</span><span>Autonomous</span></div>
      <p class="small muted">${esc(qualityText(P.quality))}</p>
    </div>

function notShared(what, p){ return `<section class="card stack" style="gap:6px"><h3>${esc(what)}</h3><p class="small muted">Not shared with you. ${esc(p.name)} decides what to share.</p></section>`; }
function renderMember(p){

        <h2>Coaching playbook</h2>
        <ul class="guide">${playbook(a).map(([s, h]) => `<li>${h} ${src(s)}</li>`).join("")}</ul>

    </aside></div>`;
}
